<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星砚航天 XY-07 发射页 · 第 01 轮方向对比</title>
<style>
  /* 对比页外壳刻意保持中性，不带任何候选方向的风格 */
  :root {
    --bg: #f4f4f2; --panel: #ffffff; --line: #dcdcd6; --text: #1d1d1b; --dim: #6b6b66;
    --accent: #1d1d1b; --accent-ink: #ffffff; --ok: #1f7a4d;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161616; --panel: #1f1f1f; --line: #333; --text: #ececea; --dim: #9a9a95; --accent: #ececea; --accent-ink: #161616; --ok: #6fd3a0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--bg); border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0; }
  .brief { color: var(--dim); margin: 2px 0 0; max-width: 60ch; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; background: var(--panel); color: var(--text); padding: 6px 12px; font: inherit; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  main { padding: 20px; display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); }
  main.single { grid-template-columns: 1fr; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .card[hidden] { display: none; }
  .stage { position: relative; background: #000; overflow: hidden; }
  .stage iframe, .stage img { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #fff; }
  .stage img { object-fit: cover; object-position: top; }
  .meta { padding: 14px 16px 16px; display: grid; gap: 6px; }
  .title { display: flex; align-items: baseline; gap: 10px; }
  .num { font: 600 12px/1 ui-monospace, Consolas, monospace; color: var(--dim); }
  .name { font-size: 16px; font-weight: 600; margin: 0; }
  .concept { margin: 0; }
  .typo { margin: 0; color: var(--dim); font-size: 13px; }
  .swatches { display: flex; gap: 4px; }
  .swatches span { width: 22px; height: 22px; border-radius: 4px; border: 1px solid var(--line); }
  .traits { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .traits li { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 99px; color: var(--dim); }
  .actions { display: flex; gap: 8px; margin-top: 6px; }
  .actions button { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; cursor: pointer; }
  .actions .pick { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; }
  .hint { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="title"></h1>
    <p class="brief" id="brief"></p>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="查看方式">
      <button data-view="grid" aria-pressed="true">并排</button>
      <button data-view="single" aria-pressed="false">单张</button>
    </div>
    <div class="seg" role="group" aria-label="视口">
      <button data-device="desktop" aria-pressed="true">桌面</button>
      <button data-device="mobile" aria-pressed="false">手机</button>
    </div>
    <span class="hint">← → 翻页</span>
  </div>
</header>
<main id="list"></main>
<div class="toast" id="toast" role="status"></div>
<script>
const DATA = {"project": "星砚航天 XY-07 发射页", "brief": "12 颗遥感卫星拼车发射的直播落地页：首屏让访客知道何时发射、能否观看，并订阅提醒", "round": "01", "defaultViewport": {"width": 1280, "height": 800}, "candidates": [{"id": "mission", "name": "任务控制台", "concept": "像坐在控制室里，盯着唯一一个会决定发射的数字", "typography": "JetBrains Mono 700 超大倒计时 / Inter 正文 15px / 等宽读数 20px", "palette": ["#07090c", "#ffb547", "#5be3b0", "#e9e4d8"], "traits": ["三栏密集网格", "倒计时占首屏中心", "检查清单带状态灯", "坐标网格底"], "baseline": false, "viewport": null, "kind": "html", "html": "<!doctype html>\n<html lang=\"zh-CN\" data-orbit=\"mission\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>XY-07 雁阵 · 任务控制台<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap\">\n<style>/* orbit.css */\n/*\n * Orbit UI — 太空科技感设计令牌与控件语法\n *\n * 用法：<link rel=\"stylesheet\" href=\"orbit.css\">，在 <html> 上写 data-orbit=\"mission|blueprint|deepfield\"\n * 选一个方向。三个方向共用同一套变量名，组件只引用变量，不写死颜色。\n * 小样里直接复制本文件到任务目录再引用，不走 CDN。\n */\n\n/* ---------- 1. 基础令牌：所有方向共享 ---------- */\n:root {\n  /* 字体：展示字 / 正文 / 遥测数据。中文回退放在拉丁字之后 */\n  --o-font-display: \"Space Grotesk\", \"Sora\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-body: \"Inter\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-mono: \"JetBrains Mono\", \"IBM Plex Mono\", \"SFMono-Regular\", Consolas, \"Microsoft YaHei\", monospace;\n\n  /* 字号：正文 15，数据 13 起，展示字靠 clamp 跟视口走 */\n  --o-text-xs: 12px;\n  --o-text-sm: 13px;\n  --o-text-md: 15px;\n  --o-text-lg: 18px;\n  --o-text-xl: clamp(24px, 2.4vw, 32px);\n  --o-text-hero: clamp(40px, 6vw, 88px);\n\n  /* 间距：4 的倍数，组内用 2–3，组间用 6–10 */\n  --o-space-1: 4px;\n  --o-space-2: 8px;\n  --o-space-3: 12px;\n  --o-space-4: 16px;\n  --o-space-6: 24px;\n  --o-space-8: 32px;\n  --o-space-12: 48px;\n  --o-space-16: 64px;\n\n  /* 形状：仪器感来自小圆角 + 切角，不来自大圆角 */\n  --o-radius: 2px;\n  --o-cut: 10px; /* 切角尺寸，用于面板与主按钮 */\n  --o-hairline: 1px;\n\n  /* 动效：仪器只有两种节奏——读数刷新与舱门开合 */\n  --o-ease: cubic-bezier(.2, .7, .1, 1);\n  --o-fast: 140ms;\n  --o-slow: 420ms;\n  --o-spring: cubic-bezier(.34, 1.45, .64, 1); /* 开关、选中：落定时轻微过冲 */\n  --o-enter: 720ms;                             /* 首次进入：读数归位、弧线充满 */\n}\n\n/* 让 --v 可以被过渡和动画：刻度环、刻度条从 0 读到目标值 */\n@property --v { syntax: \"<number>\"; inherits: true; initial-value: 0; }\n\n/* ---------- 2. 方向令牌：一个方向只有一个主角色 ---------- */\n\n/* 任务控制台：深炭底 + 琥珀读数，像发射场的 CRT 控制台。主角是数据 */\n:root,\n[data-orbit=\"mission\"] {\n  --o-bg: #07090c;\n  --o-surface: #0e1217;\n  --o-surface-2: #151b22;\n  --o-line: rgba(255, 196, 92, .16);\n  --o-line-strong: rgba(255, 196, 92, .42);\n  --o-text: #e9e4d8;\n  --o-text-dim: #9a968c;\n  --o-accent: #ffb547;      /* 琥珀：主动作与关键读数 */\n  --o-accent-ink: #1a1206;\n  --o-signal: #5be3b0;      /* 正常 / 链路通 */\n  --o-warn: #ffd166;\n  --o-alert: #ff5a4e;       /* 中止 / 故障 */\n  --o-glow: 0 0 24px rgba(255, 181, 71, .28);\n  --o-grid: rgba(255, 196, 92, .05);\n}\n\n/* 轨道蓝图：钴蓝底 + 白色细线，像工程图纸与星图。主角是轨迹线 */\n[data-orbit=\"blueprint\"] {\n  --o-bg: #0a1a3a;\n  --o-surface: #0f2350;\n  --o-surface-2: #142c62;\n  --o-line: rgba(214, 228, 255, .2);\n  --o-line-strong: rgba(214, 228, 255, .6);\n  --o-text: #f1f5ff;\n  --o-text-dim: #a9b8dc;\n  --o-accent: #f1f5ff;\n  --o-accent-ink: #0a1a3a;\n  --o-signal: #7fe7ff;\n  --o-warn: #ffe08a;\n  --o-alert: #ff7a6b;\n  --o-glow: none;\n  --o-grid: rgba(214, 228, 255, .07);\n}\n\n/* 深空：近黑底 + 离子白 + 一点等离子紫，像深场望远镜照片。主角是留白与一束光 */\n[data-orbit=\"deepfield\"] {\n  --o-bg: #020205;\n  --o-surface: #0a0a12;\n  --o-surface-2: #12121d;\n  --o-line: rgba(200, 200, 255, .1);\n  --o-line-strong: rgba(200, 200, 255, .3);\n  --o-text: #f4f3ff;\n  --o-text-dim: #8d8ba6;\n  --o-accent: #a98bff;\n  --o-accent-ink: #0b0618;\n  --o-signal: #8cf5d2;\n  --o-warn: #ffd98a;\n  --o-alert: #ff6b8b;\n  --o-glow: 0 0 40px rgba(169, 139, 255, .35);\n  --o-grid: rgba(200, 200, 255, .035);\n}\n\n/* 星际拓荒（NASA-punk）：参考 Starfield 的界面语言——石墨底、暖白细线、\n * 选中项反白、端点带圆点的引线、四色涂装条。主角是“被标注的星球”和反白的那一行 */\n[data-orbit=\"frontier\"] {\n  --o-font-display: \"Jost\", \"Futura\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  --o-font-body: \"Barlow\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-mono: \"Barlow Semi Condensed\", \"Barlow\", \"Microsoft YaHei\", sans-serif; /* 读数不用等宽，用 tabular-nums 对齐 */\n  --o-bg: #0b0d10;\n  --o-surface: rgba(22, 26, 31, .78);\n  --o-surface-2: rgba(38, 43, 50, .85);\n  --o-line: rgba(236, 234, 226, .18);\n  --o-line-strong: rgba(236, 234, 226, .62);\n  --o-text: #eceae2;\n  --o-text-dim: #9aa0a6;\n  --o-accent: #eceae2;      /* 主动作与选中：反白，不用彩色 */\n  --o-accent-ink: #0b0d10;\n  --o-signal: #6fc3df;\n  --o-warn: #f2a93b;\n  --o-alert: #e2523f;\n  --o-glow: none;\n  --o-grid: rgba(236, 234, 226, .04);\n  /* 涂装条四色：只出现在品牌位和一处主视觉 */\n  --o-stripe-1: #2b5c9e;\n  --o-stripe-2: #d6402b;\n  --o-stripe-3: #ec7d2a;\n  --o-stripe-4: #f2b33d;\n  --o-cut: 0px;\n  --o-radius: 3px;\n  --o-btn-cut: 0px;\n  --o-btn-radius: 3px;\n}\n\n/* ---------- 3. 基础 ---------- */\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--o-bg);\n  color: var(--o-text);\n  font: 400 var(--o-text-md)/1.65 var(--o-font-body);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* 坐标网格背景：只铺在需要“仪器感”的区域，不铺满每一页 */\n.o-grid-bg {\n  background-image:\n    linear-gradient(var(--o-grid) 1px, transparent 1px),\n    linear-gradient(90deg, var(--o-grid) 1px, transparent 1px);\n  background-size: 32px 32px;\n}\n\n/* 遥测数字：等宽 + 等宽数字，刷新时不跳动 */\n.o-mono,\n.o-readout {\n  font-family: var(--o-font-mono);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: .02em;\n}\n.o-readout {\n  font-size: var(--o-text-xl);\n  color: var(--o-accent);\n  line-height: 1.1;\n}\n.o-readout small {\n  font-size: var(--o-text-sm);\n  color: var(--o-text-dim);\n  margin-left: 4px;\n}\n\n.o-label {\n  font: 500 var(--o-text-sm)/1.4 var(--o-font-mono);\n  color: var(--o-text-dim);\n}\n\n.o-display {\n  font: 600 var(--o-text-hero)/1.05 var(--o-font-display);\n  letter-spacing: -.02em;\n  margin: 0;\n}\n.o-display:lang(zh) { line-height: 1.2; letter-spacing: 0; }\n\n/* ---------- 4. 面板：切角 + 细线，层级只靠底色和线的强弱 ---------- */\n.o-panel {\n  position: relative;\n  background: var(--o-surface);\n  border: var(--o-hairline) solid var(--o-line);\n  padding: var(--o-space-6);\n  border-radius: var(--o-radius);\n  clip-path: polygon(0 0, calc(100% - var(--o-cut)) 0, 100% var(--o-cut), 100% 100%, var(--o-cut) 100%, 0 calc(100% - var(--o-cut)));\n}\n[data-orbit=\"frontier\"] .o-panel { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }\n\n/* 四角定位标：表示“这里是一块被测量的区域”。一屏最多用在一处 */\n.o-brackets {\n  position: relative;\n  --b: 12px;\n  background:\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top left / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top left / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top right / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top right / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom left / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom left / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom right / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom right / 1px var(--b);\n  background-repeat: no-repeat;\n}\n\n/* ---------- 5. 控件：同一套语法——切角、等宽标签、按下下沉 1px ---------- */\n.o-btn {\n  --cut: var(--o-btn-cut, 8px);\n  border-radius: var(--o-btn-radius, 0);\n  display: inline-flex;\n  align-items: center;\n  gap: var(--o-space-2);\n  min-height: 40px;\n  padding: 0 var(--o-space-4);\n  border: var(--o-hairline) solid var(--o-line-strong);\n  background: transparent;\n  color: var(--o-text);\n  font: 500 var(--o-text-md)/1 var(--o-font-body);\n  cursor: pointer;\n  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);\n  transition: background var(--o-fast) var(--o-ease), color var(--o-fast) var(--o-ease), border-color var(--o-fast) var(--o-ease),\n    box-shadow var(--o-slow) var(--o-ease), transform var(--o-fast) var(--o-ease);\n  text-decoration: none;\n  position: relative;\n  overflow: hidden;\n}\n.o-btn:hover { background: var(--o-surface-2); border-color: var(--o-text); }\n.o-btn:active { transform: translateY(1px) scale(.985); }\n/* 悬停时一道细光从左扫到右，只扫一次 */\n.o-btn::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, currentColor 16%, transparent) 50%, transparent 70%);\n  transform: translateX(-110%);\n  pointer-events: none;\n}\n.o-btn:hover::before { transform: translateX(110%); transition: transform 700ms var(--o-ease); }\n.o-btn:focus-visible { outline: 2px solid var(--o-accent); outline-offset: 3px; }\n.o-btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }\n\n.o-btn--primary {\n  background: var(--o-accent);\n  border-color: var(--o-accent);\n  color: var(--o-accent-ink);\n  box-shadow: var(--o-glow);\n}\n.o-btn--primary:hover { background: color-mix(in srgb, var(--o-accent) 86%, white); border-color: color-mix(in srgb, var(--o-accent) 86%, white); }\n.o-btn--danger:hover { background: color-mix(in srgb, var(--o-alert) 12%, transparent); border-color: var(--o-alert); }\n\n.o-btn--danger { border-color: var(--o-alert); color: var(--o-alert); }\n\n/* 处理中：读数条从左扫到右，宽度不变 */\n.o-btn[aria-busy=\"true\"] { position: relative; pointer-events: none; }\n.o-btn[aria-busy=\"true\"]::after {\n  content: \"\";\n  position: absolute;\n  left: 0; bottom: 0;\n  height: 2px; width: 30%;\n  background: currentColor;\n  animation: o-sweep 1.1s var(--o-ease) infinite;\n}\n\n.o-input {\n  width: 100%;\n  min-height: 40px;\n  padding: 0 var(--o-space-3);\n  background: var(--o-bg);\n  border: var(--o-hairline) solid var(--o-line);\n  border-bottom-color: var(--o-line-strong);\n  color: var(--o-text);\n  font: 400 var(--o-text-md)/1 var(--o-font-mono);\n  border-radius: var(--o-radius);\n  transition: border-color var(--o-fast) var(--o-ease), box-shadow var(--o-slow) var(--o-ease);\n}\n.o-input:hover { border-bottom-color: var(--o-text); }\n.o-input[aria-invalid=\"true\"] { animation: o-shake 360ms var(--o-ease); }\n.o-input:focus { outline: none; border-color: var(--o-accent); box-shadow: inset 0 -2px 0 var(--o-accent); }\n.o-input[aria-invalid=\"true\"] { border-color: var(--o-alert); box-shadow: inset 0 -2px 0 var(--o-alert); }\n\n/* 状态灯：颜色 + 形状 + 文字三重表达，不只靠颜色 */\n.o-status {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font: 500 var(--o-text-sm)/1 var(--o-font-mono);\n  color: var(--o-text-dim);\n}\n.o-status::before {\n  content: \"\";\n  width: 8px; height: 8px;\n  background: var(--c, var(--o-signal));\n  box-shadow: 0 0 8px var(--c, var(--o-signal));\n}\n.o-status--nominal { --c: var(--o-signal); }\n.o-status--nominal::before { border-radius: 50%; animation: o-breathe 3.2s ease-in-out infinite; }\n.o-status--warn { --c: var(--o-warn); }\n.o-status--warn::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); animation: o-breathe 1.8s ease-in-out infinite; }\n.o-status--alert { --c: var(--o-alert); color: var(--o-alert); }\n.o-status--alert::before { animation: o-blink 1s steps(2) infinite; }\n\n/* 刻度条：替代普通进度条，读得出数值 */\n.o-gauge {\n  --v: 50;\n  height: 8px;\n  background:\n    repeating-linear-gradient(90deg, var(--o-line-strong) 0 1px, transparent 1px 10%),\n    var(--o-surface-2);\n  position: relative;\n}\n.o-gauge::after {\n  content: \"\";\n  position: absolute;\n  inset: 0 auto 0 0;\n  width: calc(var(--v) * 1%);\n  background: var(--o-accent);\n t(0 0 0 0); } }\n@keyframes o-breathe { 50% { opacity: .45; box-shadow: 0 0 2px var(--c, var(--o-signal)); } }\n@keyframes o-ring {\n  from { box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn), 0 0 0 0 color-mix(in srgb, var(--o-warn) 55%, transparent); }\n  to { box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn), 0 0 0 9px transparent; }\n}\n@keyframes o-ping {\n  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--o-accent) 60%, transparent); }\n  to { box-shadow: 0 0 0 11px transparent; }\n}\n@keyframes o-pop { from { transform: translateY(1px) scale(0); } }\n@keyframes o-shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }\n@keyframes o-tick { from { color: var(--o-text); text-shadow: 0 0 14px currentColor; } }\n@keyframes o-float { 50% { transform: translateY(-10px); } }\n@keyframes o-dash { to { stroke-dashoffset: 0; } }\n\n/* 面板启动：自左向右“上电”，同一屏依次延迟 60ms */\n.o-boot { animation: o-boot var(--o-slow) var(--o-ease) both; animation-delay: calc(var(--i, 0) * 60ms); }\n\n/* 浮现：内容块自下而上淡入。.o-stagger 的直接子元素依次延迟 70ms */\n.o-rise { animation: o-rise var(--o-enter) var(--o-ease) both; animation-delay: calc(var(--i, 0) * 70ms); }\n.o-stagger > * { animation: o-rise var(--o-enter) var(--o-ease) both; }\n.o-stagger > :nth-child(2) { animation-delay: 70ms; }\n.o-stagger > :nth-child(3) { animation-delay: 140ms; }\n.o-stagger > :nth-child(4) { animation-delay: 210ms; }\n.o-stagger > :nth-child(5) { animation-delay: 280ms; }\n.o-stagger > :nth-child(6) { animation-delay: 350ms; }\n.o-stagger > :nth-child(7) { animation-delay: 420ms; }\n.o-stagger > :nth-child(n+8) { animation-delay: 490ms; }\n\n/* 描线：SVG 路径从起点画到终点。路径上写 pathLength=\"1\"，--d 控制开始时间、--t 控制时长 */\n.o-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: o-dash var(--t, 1.4s) var(--o-ease) var(--d, .2s) forwards; }\n\n/* 读数刷新：数字变化时由脚本加上 .is-tick，亮一下再回到原色 */\n.o-tick.is-tick { animation: o-tick 600ms var(--o-ease); }\n\n/* 漂浮：给星球这类主视觉一点慢呼吸，周期 12 秒以上 */\n.o-float { animation: o-float var(--t, 14s) ease-in-out infinite; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }\n}\n<\/style>\n<style>\n  body { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }\n  .bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--o-line); }\n  .brand { font: 700 15px/1 var(--o-font-mono); letter-spacing: .04em; }\n  .brand span { color: var(--o-text-dim); font-weight: 400; margin-left: 10px; }\n  .utc { font: 500 13px/1 var(--o-font-mono); color: var(--o-text-dim); }\n  .deck { display: grid; grid-template-columns: 1fr minmax(0, 2.2fr) 1fr; gap: 1px; background: var(--o-line); }\n  .deck > section { background: var(--o-bg); padding: 28px; }\n  .center { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 20px; }\n  .t { font: 700 clamp(44px, 7vw, 120px)/.95 var(--o-font-mono); font-variant-numeric: tabular-nums; color: var(--o-accent); text-shadow: 0 0 28px rgba(255,181,71,.35); letter-spacing: -.03em; }\n  .t small { display: block; font-size: 14px; font-weight: 500; color: var(--o-text-dim); letter-spacing: .08em; text-shadow: none; margin-bottom: 8px; }\n  h1 { font: 600 clamp(22px, 2.4vw, 30px)/1.3 var(--o-font-body); margin: 0; }\n  .lede { color: var(--o-text-dim); max-width: 36em; margin: 0; }\n  .cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }\n  .rows { display: grid; gap: 28px; align-content: start; }\n  .row .o-label { display: block; margin-bottom: 4px; }\n  .row b { font: 500 20px/1.2 var(--o-font-mono); font-variant-numeric: tabular-nums; }\n  .row b small { font-size: 13px; color: var(--o-text-dim); margin-left: 4px; font-weight: 400; }\n  .checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }\n  .checks li { display: flex; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--o-line); font-size: 14px; }\n  .t .o-tick.is-tick { animation-duration: 900ms; }\n  .foot { display: flex; justify-content: space-between; gap: 16px; padding: 12px 28px; border-top: 1px solid var(--o-line); font: 400 13px/1.4 var(--o-font-mono); color: var(--o-text-dim); }\n  @media (max-width: 860px) {\n    .deck { grid-template-columns: 1fr; }\n    .center { order: -1; padding: 40px 20px !important; }\n    .deck > section { padding: 20px; }\n    .bar, .foot { padding: 12px 20px; }\n    .utc { display: none; }\n  }\n<\/style>\n<\/head>\n<body class=\"o-grid-bg\">\n  <header class=\"bar\">\n    <div class=\"brand\">星砚航天<span>XY-07 雁阵<\/span><\/div>\n    <div class=\"utc\">UTC 2026-10-18 <span id=\"utc\">00:31:43<\/span><\/div>\n    <span class=\"o-status o-status--nominal\">全系统正常<\/span>\n  <\/header>\n\n  <main class=\"deck\">\n    <section class=\"rows o-stagger\">\n      <div class=\"row\"><span class=\"o-label\">目标轨道<\/span><b>550<small>km SSO<\/small><\/b><\/div>\n      <div class=\"row\"><span class=\"o-label\">倾角<\/span><b>97.6<small>°<\/small><\/b><\/div>\n      <div class=\"row\"><span class=\"o-label\">载荷<\/span><b>12<small>颗 · 1,384 kg<\/small><\/b><\/div>\n      <div class=\"row\"><span class=\"o-label\">推进剂加注<\/span><b><span class=\"o-tick\" id=\"fuel\">94.2<\/span><small>%<\/small><\/b>\n        <div class=\"o-gauge\" id=\"fuel-g\" style=\"--v:94.2;margin-top:8px\"><\/div><\/div>\n    <\/section>\n\n    <section class=\"center o-stagger\">\n      <div class=\"t\"><small>距点火<\/small><span class=\"o-tick\" id=\"t\">T−01:42:17<\/span><\/div>\n      <h1>12 颗遥感卫星，一次送入晨昏轨道<\/h1>\n      <p class=\"lede\">发射窗口 10 月 18 日 02:14 UTC，持续 11 分钟。直播从 T−30 分钟开始，全程播放箭上相机与遥测。<\/p>\n      <div class=\"cta\">\n        <a class=\"o-btn o-btn--primary\" href=\"#\">观看直播<\/a>\n        <a class=\"o-btn\" href=\"#\">发射前 10 分钟提醒我<\/a>\n      <\/div>\n    <\/section>\n\n    <section>\n      <ul class=\"checks o-stagger\">\n        <li>气象 · 高空风 <span class=\"o-status o-status--nominal\">通过<\/span><\/li>\n        <li>靶场安全 <span class=\"o-status o-status--nominal\">通过<\/span><\/li>\n        <li>一级液氧补加 <span class=\"o-status o-status--warn\" id=\"lox\">进行中<\/span><\/li>\n        <li>测控链路 <span class=\"o-status o-status--nominal\">238 ms<\/span><\/li>\n        <li>回收船就位 <span class=\"o-status o-status--nominal\">东经 121.4°<\/span><\/li>\n      <\/ul>\n    <\/section>\n  <\/main>\n\n  <footer class=\"foot\">\n    <span>下一个检查点 T−01:30:00 · 一级推进剂加注完成<\/span>\n    <span>酒泉 · 9A 工位<\/span>\n  <\/footer>\n<script>\n  // 倒计时每秒走一格；分钟位变化时闪一下。推进剂读数慢慢爬升，到 100% 时检查项变绿\n  const tick = (el, text) => { if (el.textContent === text) return; el.textContent = text; el.classList.remove(\"is-tick\"); void el.offsetWidth; el.classList.add(\"is-tick\"); };\n  const p = n => String(n).padStart(2, \"0\");\n  let s = 1 * 3600 + 42 * 60 + 17, utc = 31 * 60 + 43, fuel = 94.2;\n  const t = document.getElementById(\"t\"), u = document.getElementById(\"utc\");\n  const f = document.getElementById(\"fuel\"), g = document.getElementById(\"fuel-g\"), lox = document.getElementById(\"lox\");\n  setInterval(() => {\n    s = Math.max(0, s - 1); utc++;\n    const text = `T−${p(s / 3600 | 0)}:${p((s / 60 | 0) % 60)}:${p(s % 60)}`;\n    if (s % 60 === 59) tick(t, text); else t.textContent = text;\n    u.textContent = `${p(utc / 3600 | 0)}:${p((utc / 60 | 0) % 60)}:${p(utc % 60)}`;\n  }, 1000);\n  const fill = setInterval(() => {\n    fuel = Math.min(100, +(fuel + .1).toFixed(1));\n    tick(f, fuel.toFixed(1)); g.style.setProperty(\"--v\", fuel);\n    if (fuel >= 100) { clearInterval(fill); lox.className = \"o-status o-status--nominal\"; lox.textContent = \"完成\"; }\n  }, 2600);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "blueprint", "name": "轨道蓝图", "concept": "把这次发射画成一张工程图纸：读懂卫星会去哪里", "typography": "Space Grotesk 600 标题 / IBM Plex Mono 标注 12–15px", "palette": ["#0a1a3a", "#f1f5ff", "#7fe7ff", "#a9b8dc"], "traits": ["左文右图", "SVG 轨道与分离点标注", "图纸标题栏", "单色白线"], "baseline": false, "viewport": null, "kind": "html", "html": "<!doctype html>\n<html lang=\"zh-CN\" data-orbit=\"blueprint\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>XY-07 雁阵 · 轨道蓝图<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap\">\n<style>/* orbit.css */\n/*\n * Orbit UI — 太空科技感设计令牌与控件语法\n *\n * 用法：<link rel=\"stylesheet\" href=\"orbit.css\">，在 <html> 上写 data-orbit=\"mission|blueprint|deepfield\"\n * 选一个方向。三个方向共用同一套变量名，组件只引用变量，不写死颜色。\n * 小样里直接复制本文件到任务目录再引用，不走 CDN。\n */\n\n/* ---------- 1. 基础令牌：所有方向共享 ---------- */\n:root {\n  /* 字体：展示字 / 正文 / 遥测数据。中文回退放在拉丁字之后 */\n  --o-font-display: \"Space Grotesk\", \"Sora\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-body: \"Inter\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-mono: \"JetBrains Mono\", \"IBM Plex Mono\", \"SFMono-Regular\", Consolas, \"Microsoft YaHei\", monospace;\n\n  /* 字号：正文 15，数据 13 起，展示字靠 clamp 跟视口走 */\n  --o-text-xs: 12px;\n  --o-text-sm: 13px;\n  --o-text-md: 15px;\n  --o-text-lg: 18px;\n  --o-text-xl: clamp(24px, 2.4vw, 32px);\n  --o-text-hero: clamp(40px, 6vw, 88px);\n\n  /* 间距：4 的倍数，组内用 2–3，组间用 6–10 */\n  --o-space-1: 4px;\n  --o-space-2: 8px;\n  --o-space-3: 12px;\n  --o-space-4: 16px;\n  --o-space-6: 24px;\n  --o-space-8: 32px;\n  --o-space-12: 48px;\n  --o-space-16: 64px;\n\n  /* 形状：仪器感来自小圆角 + 切角，不来自大圆角 */\n  --o-radius: 2px;\n  --o-cut: 10px; /* 切角尺寸，用于面板与主按钮 */\n  --o-hairline: 1px;\n\n  /* 动效：仪器只有两种节奏——读数刷新与舱门开合 */\n  --o-ease: cubic-bezier(.2, .7, .1, 1);\n  --o-fast: 140ms;\n  --o-slow: 420ms;\n  --o-spring: cubic-bezier(.34, 1.45, .64, 1); /* 开关、选中：落定时轻微过冲 */\n  --o-enter: 720ms;                             /* 首次进入：读数归位、弧线充满 */\n}\n\n/* 让 --v 可以被过渡和动画：刻度环、刻度条从 0 读到目标值 */\n@property --v { syntax: \"<number>\"; inherits: true; initial-value: 0; }\n\n/* ---------- 2. 方向令牌：一个方向只有一个主角色 ---------- */\n\n/* 任务控制台：深炭底 + 琥珀读数，像发射场的 CRT 控制台。主角是数据 */\n:root,\n[data-orbit=\"mission\"] {\n  --o-bg: #07090c;\n  --o-surface: #0e1217;\n  --o-surface-2: #151b22;\n  --o-line: rgba(255, 196, 92, .16);\n  --o-line-strong: rgba(255, 196, 92, .42);\n  --o-text: #e9e4d8;\n  --o-text-dim: #9a968c;\n  --o-accent: #ffb547;      /* 琥珀：主动作与关键读数 */\n  --o-accent-ink: #1a1206;\n  --o-signal: #5be3b0;      /* 正常 / 链路通 */\n  --o-warn: #ffd166;\n  --o-alert: #ff5a4e;       /* 中止 / 故障 */\n  --o-glow: 0 0 24px rgba(255, 181, 71, .28);\n  --o-grid: rgba(255, 196, 92, .05);\n}\n\n/* 轨道蓝图：钴蓝底 + 白色细线，像工程图纸与星图。主角是轨迹线 */\n[data-orbit=\"blueprint\"] {\n  --o-bg: #0a1a3a;\n  --o-surface: #0f2350;\n  --o-surface-2: #142c62;\n  --o-line: rgba(214, 228, 255, .2);\n  --o-line-strong: rgba(214, 228, 255, .6);\n  --o-text: #f1f5ff;\n  --o-text-dim: #a9b8dc;\n  --o-accent: #f1f5ff;\n  --o-accent-ink: #0a1a3a;\n  --o-signal: #7fe7ff;\n  --o-warn: #ffe08a;\n  --o-alert: #ff7a6b;\n  --o-glow: none;\n  --o-grid: rgba(214, 228, 255, .07);\n}\n\n/* 深空：近黑底 + 离子白 + 一点等离子紫，像深场望远镜照片。主角是留白与一束光 */\n[data-orbit=\"deepfield\"] {\n  --o-bg: #020205;\n  --o-surface: #0a0a12;\n  --o-surface-2: #12121d;\n  --o-line: rgba(200, 200, 255, .1);\n  --o-line-strong: rgba(200, 200, 255, .3);\n  --o-text: #f4f3ff;\n  --o-text-dim: #8d8ba6;\n  --o-accent: #a98bff;\n  --o-accent-ink: #0b0618;\n  --o-signal: #8cf5d2;\n  --o-warn: #ffd98a;\n  --o-alert: #ff6b8b;\n  --o-glow: 0 0 40px rgba(169, 139, 255, .35);\n  --o-grid: rgba(200, 200, 255, .035);\n}\n\n/* 星际拓荒（NASA-punk）：参考 Starfield 的界面语言——石墨底、暖白细线、\n * 选中项反白、端点带圆点的引线、四色涂装条。主角是“被标注的星球”和反白的那一行 */\n[data-orbit=\"frontier\"] {\n  --o-font-display: \"Jost\", \"Futura\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  --o-font-body: \"Barlow\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-mono: \"Barlow Semi Condensed\", \"Barlow\", \"Microsoft YaHei\", sans-serif; /* 读数不用等宽，用 tabular-nums 对齐 */\n  --o-bg: #0b0d10;\n  --o-surface: rgba(22, 26, 31, .78);\n  --o-surface-2: rgba(38, 43, 50, .85);\n  --o-line: rgba(236, 234, 226, .18);\n  --o-line-strong: rgba(236, 234, 226, .62);\n  --o-text: #eceae2;\n  --o-text-dim: #9aa0a6;\n  --o-accent: #eceae2;      /* 主动作与选中：反白，不用彩色 */\n  --o-accent-ink: #0b0d10;\n  --o-signal: #6fc3df;\n  --o-warn: #f2a93b;\n  --o-alert: #e2523f;\n  --o-glow: none;\n  --o-grid: rgba(236, 234, 226, .04);\n  /* 涂装条四色：只出现在品牌位和一处主视觉 */\n  --o-stripe-1: #2b5c9e;\n  --o-stripe-2: #d6402b;\n  --o-stripe-3: #ec7d2a;\n  --o-stripe-4: #f2b33d;\n  --o-cut: 0px;\n  --o-radius: 3px;\n  --o-btn-cut: 0px;\n  --o-btn-radius: 3px;\n}\n\n/* ---------- 3. 基础 ---------- */\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--o-bg);\n  color: var(--o-text);\n  font: 400 var(--o-text-md)/1.65 var(--o-font-body);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* 坐标网格背景：只铺在需要“仪器感”的区域，不铺满每一页 */\n.o-grid-bg {\n  background-image:\n    linear-gradient(var(--o-grid) 1px, transparent 1px),\n    linear-gradient(90deg, var(--o-grid) 1px, transparent 1px);\n  background-size: 32px 32px;\n}\n\n/* 遥测数字：等宽 + 等宽数字，刷新时不跳动 */\n.o-mono,\n.o-readout {\n  font-family: var(--o-font-mono);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: .02em;\n}\n.o-readout {\n  font-size: var(--o-text-xl);\n  color: var(--o-accent);\n  line-height: 1.1;\n}\n.o-readout small {\n  font-size: var(--o-text-sm);\n  color: var(--o-text-dim);\n  margin-left: 4px;\n}\n\n.o-label {\n  font: 500 var(--o-text-sm)/1.4 var(--o-font-mono);\n  color: var(--o-text-dim);\n}\n\n.o-display {\n  font: 600 var(--o-text-hero)/1.05 var(--o-font-display);\n  letter-spacing: -.02em;\n  margin: 0;\n}\n.o-display:lang(zh) { line-height: 1.2; letter-spacing: 0; }\n\n/* ---------- 4. 面板：切角 + 细线，层级只靠底色和线的强弱 ---------- */\n.o-panel {\n  position: relative;\n  background: var(--o-surface);\n  border: var(--o-hairline) solid var(--o-line);\n  padding: var(--o-space-6);\n  border-radius: var(--o-radius);\n  clip-path: polygon(0 0, calc(100% - var(--o-cut)) 0, 100% var(--o-cut), 100% 100%, var(--o-cut) 100%, 0 calc(100% - var(--o-cut)));\n}\n[data-orbit=\"frontier\"] .o-panel { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }\n\n/* 四角定位标：表示“这里是一块被测量的区域”。一屏最多用在一处 */\n.o-brackets {\n  position: relative;\n  --b: 12px;\n  background:\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top left / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top left / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top right / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top right / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom left / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom left / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom right / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom right / 1px var(--b);\n  background-repeat: no-repeat;\n}\n\n/* ---------- 5. 控件：同一套语法——切角、等宽标签、按下下沉 1px ---------- */\n.o-btn {\n  --cut: var(--o-btn-cut, 8px);\n  border-radius: var(--o-btn-radius, 0);\n  display: inline-flex;\n  align-items: center;\n  gap: var(--o-space-2);\n  min-height: 40px;\n  padding: 0 var(--o-space-4);\n  border: var(--o-hairline) solid var(--o-line-strong);\n  background: transparent;\n  color: var(--o-text);\n  font: 500 var(--o-text-md)/1 var(--o-font-body);\n  cursor: pointer;\n  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);\n  transition: background var(--o-fast) var(--o-ease), color var(--o-fast) var(--o-ease), border-color var(--o-fast) var(--o-ease),\n    box-shadow var(--o-slow) var(--o-ease), transform var(--o-fast) var(--o-ease);\n  text-decoration: none;\n  position: relative;\n  overflow: hidden;\n}\n.o-btn:hover { background: var(--o-surface-2); border-color: var(--o-text); }\n.o-btn:active { transform: translateY(1px) scale(.985); }\n/* 悬停时一道细光从左扫到右，只扫一次 */\n.o-btn::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, currentColor 16%, transparent) 50%, transparent 70%);\n  transform: translateX(-110%);\n  pointer-events: none;\n}\n.o-btn:hover::before { transform: translateX(110%); transition: transform 700ms var(--o-ease); }\n.o-btn:focus-visible { outline: 2px solid var(--o-accent); outline-offset: 3px; }\n.o-btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }\n\n.o-btn--primary {\n  background: var(--o-accent);\n  border-color: var(--o-accent);\n  color: var(--o-accent-ink);\n  box-shadow: var(--o-glow);\n}\n.o-btn--primary:hover { background: color-mix(in srgb, var(--o-accent) 86%, white); border-color: color-mix(in srgb, var(--o-accent) 86%, white); }\n.o-btn--danger:hover { background: color-mix(in srgb, var(--o-alert) 12%, transparent); border-color: var(--o-alert); }\n\n.o-btn--danger { border-color: var(--o-alert); color: var(--o-alert); }\n\n/* 处理中：读数条从左扫到右，宽度不变 */\n.o-btn[aria-busy=\"true\"] { position: relative; pointer-events: none; }\n.o-btn[aria-busy=\"true\"]::after {\n  content: \"\";\n  position: absolute;\n  left: 0; bottom: 0;\n  height: 2px; width: 30%;\n  background: currentColor;\n  animation: o-sweep 1.1s var(--o-ease) infinite;\n}\n\n.o-input {\n  width: 100%;\n  min-height: 40px;\n  padding: 0 var(--o-space-3);\n  background: var(--o-bg);\n  border: var(--o-hairline) solid var(--o-line);\n  border-bottom-color: var(--o-line-strong);\n  color: var(--o-text);\n  font: 400 var(--o-text-md)/1 var(--o-font-mono);\n  border-radius: var(--o-radius);\n  transition: border-color var(--o-fast) var(--o-ease), box-shadow var(--o-slow) var(--o-ease);\n}\n.o-input:hover { border-bottom-color: var(--o-text); }\n.o-input[aria-invalid=\"true\"] { animation: o-shake 360ms var(--o-ease); }\n.o-input:focus { outline: none; border-color: var(--o-accent); box-shadow: inset 0 -2px 0 var(--o-accent); }\n.o-input[aria-invalid=\"true\"] { border-color: var(--o-alert); box-shadow: inset 0 -2px 0 var(--o-alert); }\n\n/* 状态灯：颜色 + 形状 + 文字三重表达，不只靠颜色 */\n.o-status {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font: 500 var(--o-text-sm)/1 var(--o-font-mono);\n  color: var(--o-text-dim);\n}\n.o-status::before {\n  content: \"\";\n  width: 8px; height: 8px;\n  background: var(--c, var(--o-signal));\n  box-shadow: 0 0 8px var(--c, var(--o-signal));\n}\n.o-status--nominal { --c: var(--o-signal); }\n.o-status--nominal::before { border-radius: 50%; animation: o-breathe 3.2s ease-in-out infinite; }\n.o-status--warn { --c: var(--o-warn); }\n.o-status--warn::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); animation: o-breathe 1.8s ease-in-out infinite; }\n.o-status--alert { --c: var(--o-alert); color: var(--o-alert); }\n.o-status--alert::before { animation: o-blink 1s steps(2) infinite; }\n\n/* 刻度条：替代普通进度条，读得出数值 */\n.o-gauge {\n  --v: 50;\n  height: 8px;\n  background:\n    repeating-linear-gradient(90deg, var(--o-line-strong) 0 1px, transparent 1px 10%),\n    var(--o-surface-2);\n  position: relative;\n}\n.o-gauge::after {\n  content: \"\";\n  position: absolute;\n  inset: 0 auto 0 0;\n  width: calc(var(--v) * 1%);\n  background: var(--o-accent);\n  transition: width var(--o-slow) var(--o-ease);\n  animation: o-fill var(--o-enter) var(--o-ease) both;\n  animation-delay: calc(200ms + var(--i, 0) * 80ms);\n}\n\n.o-divider {\n  height: 1px;\n  border: 0;\n  background: linear-gradient(90deg, var(--o-line-strong), transparent);\n  margin: var(--o-space-6) 0;\n}\n\n/* ---------- 6. 线条原语（星际拓荒方向的主语言，其他方向也可借用） ---------- */\n\n/* 涂装条：四色等宽色带。一页最多两处：品牌位 + 一处主视觉 */\n.o-stripe {\n  display: block;\n  height: var(--h, 4px);\n  width: var(--w, 72px);\n  background: linear-gradient(90deg,\n    var(--o-stripe-1, var(--o-accent)) 0 25%, var(--o-stripe-2, var(--o-accent)) 0 50%,\n    var(--o-stripe-3, var(--o-accent)) 0 75%, var(--o-stripe-4, var(--o-accent)) 0);\n  animation: o-wipe 700ms var(--o-ease) 120ms both;\n}\n\n/* 节点引线：起点实心圆点，终点短竖刻度。用来分区、连接标注与对象 */\n.o-rule {\n  position: relative;\n  height: 1px;\n  background: var(--o-line-strong);\n  margin: var(--o-space-6) 5px;\n  transform-origin: left;\n  animation: o-draw-x 900ms var(--o-ease) both;\n}\n.o-rule::before,\n.o-rule::after { content: \"\"; position: absolute; top: 50%; }\n.o-rule::before { left: -5px; width: 5px; height: 5px; border-radius: 50%; background: var(--o-line-strong); transform: translateY(-50%); }\n.o-rule::after { right: -1px; width: 1px; height: 9px; background: var(--o-line-strong); transform: translateY(-50%); }\n.o-rule--soft { background: var(--o-line); }\n\n/* 刻度环：一圈短刻度 + 一段读数弧。--v 是 0–100 的进度 */\n.o-arc {\n  --v: 60;\n  --size: 220px;\n  --track: var(--o-line);\n  position: relative;\n  width: var(--size);\n  aspect-ratio: 1;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  text-align: center;\n  transition: --v var(--o-slow) var(--o-ease);\n  animation: o-arc-in 1.2s var(--o-ease) 150ms backwards;\n}\n.o-arc::before,\n.o-arc::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: 50%;\n}\n/* 外圈刻度：每 6° 一格 */\n.o-arc::before {\n  background: repeating-conic-gradient(var(--track) 0 .6deg, transparent .6deg 6deg);\n  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 8px));\n          mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 8px));\n  animation: o-orbit 240s linear infinite; /* 刻度圈极慢地转，像仪表还活着 */\n}\n/* 内圈读数弧：细线，进度 ody);\n  padding: 7px 14px; border-radius: 999px; cursor: pointer;\n  transition: background var(--o-slow) var(--o-spring), color var(--o-fast) var(--o-ease), transform var(--o-fast) var(--o-ease);\n}\n.o-tabs > button:hover { color: var(--o-text); }\n.o-tabs > button:active { transform: scale(.96); }\n.o-tabs > [aria-selected=\"true\"] { background: var(--o-accent); color: var(--o-accent-ink); }\n\n/* 任务目标：空心圆 = 待办，实心圆 = 完成，圆环 = 进行中 */\n.o-objectives { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }\n.o-objectives li { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: baseline; }\n.o-objectives li::before {\n  content: \"\";\n  width: 10px; height: 10px;\n  border: 1.5px solid var(--o-line-strong);\n  border-radius: 50%;\n  transform: translateY(1px);\n}\n.o-objectives li[data-state=\"done\"] { color: var(--o-text-dim); }\n.o-objectives li[data-state=\"done\"]::before { background: var(--o-line-strong); }\n.o-objectives li[data-state=\"active\"]::before { border-color: var(--o-warn); box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn); animation: o-ring 2s ease-out infinite; }\n.o-objectives li[data-state=\"done\"]::before { animation: o-pop 420ms var(--o-spring) both; animation-delay: calc(300ms + var(--i, 0) * 90ms); }\n\n/* ---------- 7. 日常业务控件：开关、表格、步骤、头像 ---------- */\n\n/* 开关：轨道里一颗“卫星”，开 = 滑到右边并点亮 */\n.o-switch {\n  appearance: none;\n  -webkit-appearance: none;\n  position: relative;\n  width: 44px;\n  height: 24px;\n  margin: 0;\n  border: 1px solid var(--o-line-strong);\n  border-radius: 999px;\n  background: transparent;\n  cursor: pointer;\n  flex: none;\n  transition: background var(--o-fast) var(--o-ease), border-color var(--o-fast) var(--o-ease);\n}\n.o-switch::after {\n  content: \"\";\n  position: absolute;\n  top: 50%; left: 4px;\n  width: 14px; height: 14px;\n  border-radius: 50%;\n  background: var(--o-text-dim);\n  transform: translateY(-50%);\n  transition: transform var(--o-slow) var(--o-spring), background var(--o-fast) var(--o-ease), box-shadow var(--o-slow) var(--o-ease);\n}\n.o-switch:checked { border-color: var(--o-accent); background: color-mix(in srgb, var(--o-accent) 18%, transparent); }\n.o-switch:checked::after { transform: translate(20px, -50%); background: var(--o-accent); box-shadow: 0 0 10px color-mix(in srgb, var(--o-accent) 60%, transparent); }\n.o-switch:focus-visible { outline: 2px solid var(--o-accent); outline-offset: 3px; }\n\n/* 表格：给人扫视和比较。数字列右对齐、等宽数字；行间只用一条弱线 */\n.o-table { width: 100%; border-collapse: collapse; font-size: var(--o-text-md); }\n.o-table th {\n  text-align: left;\n  font: 500 var(--o-text-sm)/1.3 var(--o-font-body);\n  color: var(--o-text-dim);\n  padding: 10px 12px;\n  border-bottom: 1px solid var(--o-line-strong);\n  white-space: nowrap;\n}\n.o-table td { padding: 12px; border-bottom: 1px solid var(--o-line); vertical-align: middle; }\n.o-table .num { text-align: right; font-family: var(--o-font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }\n.o-table tbody tr { transition: background var(--o-fast) var(--o-ease); }\n.o-table tbody tr:hover { background: var(--o-surface-2); }\n\n/* 步骤轨迹：订单、物流、审批。竖线是“轨迹”，节点是“检查点” */\n.o-track { list-style: none; margin: 0; padding: 0; }\n.o-track li { position: relative; padding: 0 0 18px 26px; }\n.o-track li::before {\n  content: \"\";\n  position: absolute; left: 4px; top: 6px;\n  width: 9px; height: 9px; border-radius: 50%;\n  border: 1.5px solid var(--o-line-strong);\n  background: var(--o-bg);\n  z-index: 1;\n}\n.o-track li::after {\n  content: \"\";\n  position: absolute; left: 8px; top: 10px; bottom: -6px;\n  width: 1px; background: var(--o-line);\n}\n.o-track li:last-child::after { display: none; }\n.o-track li[data-state=\"done\"]::before { background: var(--o-line-strong); }\n.o-track li[data-state=\"done\"]::after { background: var(--o-line-strong); }\n.o-track li[data-state=\"active\"]::before { border-color: var(--o-accent); background: var(--o-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--o-accent) 22%, transparent); animation: o-ping 2s ease-out infinite; }\n.o-track li[data-state=\"done\"]::after { transform-origin: top; animation: o-draw-y 500ms var(--o-ease) both; animation-delay: calc(200ms + var(--i, 0) * 120ms); }\n.o-track b { display: block; font-weight: 500; }\n.o-track small { color: var(--o-text-dim); font: 500 var(--o-text-sm)/1.5 var(--o-font-mono); font-variant-numeric: tabular-nums; }\n\n/* 头像 / 图标位：圆形细线框，内放首字 */\n.o-avatar {\n  display: inline-grid; place-items: center; flex: none;\n  width: 36px; height: 36px; border-radius: 50%;\n  border: 1px solid var(--o-line-strong);\n  font: 500 14px/1 var(--o-font-body);\n  color: var(--o-text);\n  background: var(--o-surface-2);\n  transition: border-color var(--o-fast) var(--o-ease), transform var(--o-slow) var(--o-spring);\n}\n.o-avatar:hover { border-color: var(--o-text); transform: scale(1.06); }\n\n/* ---------- 8. 动效原语 ---------- */\n@keyframes o-sweep { from { transform: translateX(0); } to { transform: translateX(240%); } }\n@keyframes o-blink { 50% { opacity: .2; } }\n@keyframes o-orbit { to { transform: rotate(360deg); } }\n@keyframes o-boot {\n  from { opacity: 0; clip-path: inset(0 100% 0 0); }\n  to { opacity: 1; clip-path: inset(0 0 0 0); }\n}\n@keyframes o-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n@keyframes o-fill { from { width: 0; } }\n@keyframes o-arc-in { from { --v: 0; } }\n@keyframes o-draw-x { from { transform: scaleX(0); } }\n@keyframes o-draw-y { from { transform: scaleY(0); } }\n@keyframes o-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }\n@keyframes o-breathe { 50% { opacity: .45; box-shadow: 0 0 2px var(--c, var(--o-signal)); } }\n@keyframes o-ring {\n  from { box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn), 0 0 0 0 color-mix(in srgb, var(--o-warn) 55%, transparent); }\n  to { box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn), 0 0 0 9px transparent; }\n}\n@keyframes o-ping {\n  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--o-accent) 60%, transparent); }\n  to { box-shadow: 0 0 0 11px transparent; }\n}\n@keyframes o-pop { from { transform: translateY(1px) scale(0); } }\n@keyframes o-shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }\n@keyframes o-tick { from { color: var(--o-text); text-shadow: 0 0 14px currentColor; } }\n@keyframes o-float { 50% { transform: translateY(-10px); } }\n@keyframes o-dash { to { stroke-dashoffset: 0; } }\n\n/* 面板启动：自左向右“上电”，同一屏依次延迟 60ms */\n.o-boot { animation: o-boot var(--o-slow) var(--o-ease) both; animation-delay: calc(var(--i, 0) * 60ms); }\n\n/* 浮现：内容块自下而上淡入。.o-stagger 的直接子元素依次延迟 70ms */\n.o-rise { animation: o-rise var(--o-enter) var(--o-ease) both; animation-delay: calc(var(--i, 0) * 70ms); }\n.o-stagger > * { animation: o-rise var(--o-enter) var(--o-ease) both; }\n.o-stagger > :nth-child(2) { animation-delay: 70ms; }\n.o-stagger > :nth-child(3) { animation-delay: 140ms; }\n.o-stagger > :nth-child(4) { animation-delay: 210ms; }\n.o-stagger > :nth-child(5) { animation-delay: 280ms; }\n.o-stagger > :nth-child(6) { animation-delay: 350ms; }\n.o-stagger > :nth-child(7) { animation-delay: 420ms; }\n.o-stagger > :nth-child(n+8) { animation-delay: 490ms; }\n\n/* 描线：SVG 路径从起点画到终点。路径上写 pathLength=\"1\"，--d 控制开始时间、--t 控制时长 */\n.o-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: o-dash var(--t, 1.4s) var(--o-ease) var(--d, .2s) forwards; }\n\n/* 读数刷新：数字变化时由脚本加上 .is-tick，亮一下再回到原色 */\n.o-tick.is-tick { animation: o-tick 600ms var(--o-ease); }\n\n/* 漂浮：给星球这类主视觉一点慢呼吸，周期 12 秒以上 */\n.o-float { animation: o-float var(--t, 14s) ease-in-out infinite; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }\n}\n<\/style>\n<style>\n  :root { --o-font-mono: \"IBM Plex Mono\", Consolas, monospace; }\n  body { min-height: 100vh; }\n  .sheet { min-height: 100vh; display: grid; grid-template-columns: minmax(320px, 5fr) 7fr; border: 1px solid var(--o-line-strong); margin: 16px; }\n  .copy { padding: 40px; display: flex; flex-direction: column; gap: 28px; border-right: 1px solid var(--o-line-strong); }\n  .titleblock { display: grid; grid-template-columns: auto 1fr; border: 1px solid var(--o-line-strong); font: 400 12px/1.4 var(--o-font-mono); }\n  .titleblock > * { padding: 6px 10px; border-bottom: 1px solid var(--o-line); }\n  .titleblock dt { color: var(--o-text-dim); border-right: 1px solid var(--o-line); }\n  .titleblock dd { margin: 0; }\n  h1 { font: 600 clamp(36px, 4.6vw, 64px)/1.15 var(--o-font-display); margin: 0; }\n  .lede { color: var(--o-text-dim); font-size: 16px; max-width: 30em; margin: 0; }\n  .when { font: 500 15px/1.6 var(--o-font-mono); }\n  .when b { display: block; font-size: 28px; font-weight: 500; }\n  .cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: auto; }\n  .plot { position: relative; overflow: hidden; }\n  .plot svg { width: 100%; height: 100%; display: block; }\n  .plot text { font: 400 12px var(--o-font-mono); fill: var(--o-text-dim); }\n  .plot .strong { fill: var(--o-text); font-size: 13px; }\n  .sat { offset-path: path(\"M 450 140 A 290 220 0 1 1 449.9 140\"); animation: fly 24s linear infinite; }\n  @keyframes fly { to { offset-distance: 100%; } }\n  /* 地球经线来回翻转，像地球在转；未来轨道的虚线缓慢流动；分离点和标注依次亮起 */\n  .meridian { transform-box: fill-box; transform-origin: center; animation: turn 14s ease-in-out infinite alternate; }\n  .meridian + .meridian { animation-delay: -7s; }\n  @keyframes turn { from { transform: scaleX(1); } to { transform: scaleX(-1); } }\n  .flow { animation: flow 3s linear infinite; }\n  @keyframes flow { to { stroke-dashoffset: -24; } }\n  .pop { transform-box: fill-box; transform-origin: center; animation: pop .5s var(--o-spring) both; }\n  @keyframes pop { from { transform: scale(0); } }\n  .fade { animation: fade .6s var(--o-ease) both; }\n  @keyframes fade { from { opacity: 0; } }\n  @media (max-width: 860px) {\n    .sheet { grid-template-columns: 1fr; margin: 8px; }\n    .copy { border-right: 0; border-bottom: 1px solid var(--o-line-strong); padding: 24px; }\n    .plot { height: 360px; }\n  }\n<\/style>\n<\/head>\n<body>\n  <div class=\"sheet\">\n    <section class=\"copy o-stagger\">\n      <dl class=\"titleblock\">\n        <dt>任务<\/dt><dd>XY-07 雁阵<\/dd>\n        <dt>图号<\/dt><dd>ORB-0718-A<\/dd>\n        <dt>比例<\/dt><dd>示意 · 不按比例<\/dd>\n      <\/dl>\n      <h1>12 颗卫星，<br><span style=\"white-space:nowrap\">一条晨昏线<\/span><\/h1>\n      <p class=\"lede\">星砚航天第七次发射。火箭在 550 公里高度分三批释放载荷，每批间隔 94 秒，最终沿同一轨道面均匀排开。<\/p>\n      <p class=\"when\"><span class=\"o-label\">发射窗口 · UTC<\/span><b>10 月 18 日 02:14<\/b>窗口 11 分钟 · 酒泉 9A 工位<\/p>\n      <div class=\"cta\">\n        <a class=\"o-btn o-btn--primary\" href=\"#\">观看直播<\/a>\n        <a class=\"o-btn\" href=\"#\">发射前 10 分钟提醒我<\/a>\n      <\/div>\n    <\/section>\n\n    <section class=\"plot o-grid-bg\" aria-label=\"轨道示意图\">\n      <svg viewBox=\"0 0 740 620\" preserveAspectRatio=\"xMidYMid meet\">\n        <\!-- 地球 -->\n        <circle cx=\"450\" cy=\"360\" r=\"120\" fill=\"none\" stroke=\"var(--o-line-strong)\" stroke-width=\"1.5\"/>\n        <path d=\"M 330 360 A 120 40 0 0 0 570 360\" fill=\"none\" stroke=\"var(--o-line)\" />\n        <ellipse class=\"meridian\" cx=\"450\" cy=\"360\" rx=\"44\" ry=\"120\" fill=\"none\" stroke=\"var(--o-line)\"/>\n        <ellipse class=\"meridian\" cx=\"450\" cy=\"360\" rx=\"44\" ry=\"120\" fill=\"none\" stroke=\"var(--o-line)\"/>\n        <line x1=\"450\" y1=\"210\" x2=\"450\" y2=\"510\" stroke=\"var(--o-line)\" stroke-dasharray=\"2 4\"/>\n        <\!-- 转移轨迹（已飞） -->\n        <path class=\"o-draw\" pathLength=\"1\" style=\"--d:.3s;--t:1.6s\" d=\"M 400 248 C 360 200, 300 190, 210 260\" fill=\"none\" stroke=\"var(--o-text)\" stroke-width=\"1.5\"/>\n        <\!-- 目标轨道（未来） -->\n        <ellipse class=\"flow\" cx=\"450\" cy=\"360\" rx=\"290\" ry=\"220\" fill=\"none\" stroke=\"var(--o-text)\" stroke-dasharray=\"6 6\" stroke-width=\"1\"/>\n        <\!-- 三批分离点 -->\n        <g fill=\"var(--o-bg)\" stroke=\"var(--o-text)\" stroke-width=\"1.5\">\n          <circle class=\"pop\" style=\"animation-delay:1.8s\" cx=\"210\" cy=\"260\" r=\"6\"/><circle class=\"pop\" style=\"animation-delay:2.1s\" cx=\"168\" cy=\"380\" r=\"6\"/><circle class=\"pop\" style=\"animation-delay:2.4s\" cx=\"214\" cy=\"482\" r=\"6\"/>\n        <\/g>\n        <g>\n          <line class=\"o-draw\" pathLength=\"1\" style=\"--d:1.9s;--t:.5s\" x1=\"210\" y1=\"260\" x2=\"120\" y2=\"218\" stroke=\"var(--o-line-strong)\"/>\n          <g class=\"fade\" style=\"animation-delay:2.3s\"><text x=\"40\" y=\"190\" class=\"strong\">第一批 · 4 颗<\/text><text x=\"40\" y=\"208\">T+00:52:10<\/text><\/g>\n          <line class=\"o-draw\" pathLength=\"1\" style=\"--d:2.2s;--t:.5s\" x1=\"168\" y1=\"380\" x2=\"60\" y2=\"380\" stroke=\"var(--o-line-strong)\"/>\n          <g class=\"fade\" style=\"animation-delay:2.6s\"><text x=\"20\" y=\"372\" class=\"strong\">第二批<\/text><text x=\"20\" y=\"398\">+94 s<\/text><\/g>\n          <line class=\"o-draw\" pathLength=\"1\" style=\"--d:2.5s;--t:.5s\" x1=\"214\" y1=\"482\" x2=\"100\" y2=\"560\" stroke=\"var(--o-line-strong)\"/>\n          <g class=\"fade\" style=\"animation-delay:2.9s\"><text x=\"40\" y=\"578\" class=\"strong\">第三批<\/text><text x=\"40\" y=\"596\">+188 s<\/text><\/g>\n        <\/g>\n        <\!-- 尺寸标注 -->\n        <line class=\"o-draw\" pathLength=\"1\" style=\"--d:1s;--t:.8s\" x1=\"450\" y1=\"360\" x2=\"740\" y2=\"360\" stroke=\"var(--o-line-strong)\"/>\n        <text x=\"600\" y=\"350\">h = 550 km<\/text>\n        <text x=\"600\" y=\"380\">i = 97.6°<\/text>\n        <rect class=\"sat\" width=\"8\" height=\"8\" x=\"-4\" y=\"-4\" fill=\"var(--o-signal)\"/>\n      <\/svg>\n    <\/section>\n  <\/div>\n<\/body>\n<\/html>\n"}, {"id": "deepfield", "name": "深空", "concept": "安静到只剩一道晨光，让人想起为什么要去太空", "typography": "Space Grotesk 300 大标题 104px / JetBrains Mono 小号读数", "palette": ["#020205", "#f4f3ff", "#a98bff", "#8d8ba6"], "traits": ["行星边缘作分区线", "Canvas 视差星点", "大留白居中", "唯一发光是大气层"], "baseline": false, "viewport": null, "kind": "html", "html": "<!doctype html>\n<html lang=\"zh-CN\" data-orbit=\"deepfield\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>XY-07 雁阵 · 深空<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500&family=JetBrains+Mono:wght@400&display=swap\">\n<style>/* orbit.css */\n/*\n * Orbit UI — 太空科技感设计令牌与控件语法\n *\n * 用法：<link rel=\"stylesheet\" href=\"orbit.css\">，在 <html> 上写 data-orbit=\"mission|blueprint|deepfield\"\n * 选一个方向。三个方向共用同一套变量名，组件只引用变量，不写死颜色。\n * 小样里直接复制本文件到任务目录再引用，不走 CDN。\n */\n\n/* ---------- 1. 基础令牌：所有方向共享 ---------- */\n:root {\n  /* 字体：展示字 / 正文 / 遥测数据。中文回退放在拉丁字之后 */\n  --o-font-display: \"Space Grotesk\", \"Sora\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-body: \"Inter\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-mono: \"JetBrains Mono\", \"IBM Plex Mono\", \"SFMono-Regular\", Consolas, \"Microsoft YaHei\", monospace;\n\n  /* 字号：正文 15，数据 13 起，展示字靠 clamp 跟视口走 */\n  --o-text-xs: 12px;\n  --o-text-sm: 13px;\n  --o-text-md: 15px;\n  --o-text-lg: 18px;\n  --o-text-xl: clamp(24px, 2.4vw, 32px);\n  --o-text-hero: clamp(40px, 6vw, 88px);\n\n  /* 间距：4 的倍数，组内用 2–3，组间用 6–10 */\n  --o-space-1: 4px;\n  --o-space-2: 8px;\n  --o-space-3: 12px;\n  --o-space-4: 16px;\n  --o-space-6: 24px;\n  --o-space-8: 32px;\n  --o-space-12: 48px;\n  --o-space-16: 64px;\n\n  /* 形状：仪器感来自小圆角 + 切角，不来自大圆角 */\n  --o-radius: 2px;\n  --o-cut: 10px; /* 切角尺寸，用于面板与主按钮 */\n  --o-hairline: 1px;\n\n  /* 动效：仪器只有两种节奏——读数刷新与舱门开合 */\n  --o-ease: cubic-bezier(.2, .7, .1, 1);\n  --o-fast: 140ms;\n  --o-slow: 420ms;\n  --o-spring: cubic-bezier(.34, 1.45, .64, 1); /* 开关、选中：落定时轻微过冲 */\n  --o-enter: 720ms;                             /* 首次进入：读数归位、弧线充满 */\n}\n\n/* 让 --v 可以被过渡和动画：刻度环、刻度条从 0 读到目标值 */\n@property --v { syntax: \"<number>\"; inherits: true; initial-value: 0; }\n\n/* ---------- 2. 方向令牌：一个方向只有一个主角色 ---------- */\n\n/* 任务控制台：深炭底 + 琥珀读数，像发射场的 CRT 控制台。主角是数据 */\n:root,\n[data-orbit=\"mission\"] {\n  --o-bg: #07090c;\n  --o-surface: #0e1217;\n  --o-surface-2: #151b22;\n  --o-line: rgba(255, 196, 92, .16);\n  --o-line-strong: rgba(255, 196, 92, .42);\n  --o-text: #e9e4d8;\n  --o-text-dim: #9a968c;\n  --o-accent: #ffb547;      /* 琥珀：主动作与关键读数 */\n  --o-accent-ink: #1a1206;\n  --o-signal: #5be3b0;      /* 正常 / 链路通 */\n  --o-warn: #ffd166;\n  --o-alert: #ff5a4e;       /* 中止 / 故障 */\n  --o-glow: 0 0 24px rgba(255, 181, 71, .28);\n  --o-grid: rgba(255, 196, 92, .05);\n}\n\n/* 轨道蓝图：钴蓝底 + 白色细线，像工程图纸与星图。主角是轨迹线 */\n[data-orbit=\"blueprint\"] {\n  --o-bg: #0a1a3a;\n  --o-surface: #0f2350;\n  --o-surface-2: #142c62;\n  --o-line: rgba(214, 228, 255, .2);\n  --o-line-strong: rgba(214, 228, 255, .6);\n  --o-text: #f1f5ff;\n  --o-text-dim: #a9b8dc;\n  --o-accent: #f1f5ff;\n  --o-accent-ink: #0a1a3a;\n  --o-signal: #7fe7ff;\n  --o-warn: #ffe08a;\n  --o-alert: #ff7a6b;\n  --o-glow: none;\n  --o-grid: rgba(214, 228, 255, .07);\n}\n\n/* 深空：近黑底 + 离子白 + 一点等离子紫，像深场望远镜照片。主角是留白与一束光 */\n[data-orbit=\"deepfield\"] {\n  --o-bg: #020205;\n  --o-surface: #0a0a12;\n  --o-surface-2: #12121d;\n  --o-line: rgba(200, 200, 255, .1);\n  --o-line-strong: rgba(200, 200, 255, .3);\n  --o-text: #f4f3ff;\n  --o-text-dim: #8d8ba6;\n  --o-accent: #a98bff;\n  --o-accent-ink: #0b0618;\n  --o-signal: #8cf5d2;\n  --o-warn: #ffd98a;\n  --o-alert: #ff6b8b;\n  --o-glow: 0 0 40px rgba(169, 139, 255, .35);\n  --o-grid: rgba(200, 200, 255, .035);\n}\n\n/* 星际拓荒（NASA-punk）：参考 Starfield 的界面语言——石墨底、暖白细线、\n * 选中项反白、端点带圆点的引线、四色涂装条。主角是“被标注的星球”和反白的那一行 */\n[data-orbit=\"frontier\"] {\n  --o-font-display: \"Jost\", \"Futura\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  --o-font-body: \"Barlow\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-mono: \"Barlow Semi Condensed\", \"Barlow\", \"Microsoft YaHei\", sans-serif; /* 读数不用等宽，用 tabular-nums 对齐 */\n  --o-bg: #0b0d10;\n  --o-surface: rgba(22, 26, 31, .78);\n  --o-surface-2: rgba(38, 43, 50, .85);\n  --o-line: rgba(236, 234, 226, .18);\n  --o-line-strong: rgba(236, 234, 226, .62);\n  --o-text: #eceae2;\n  --o-text-dim: #9aa0a6;\n  --o-accent: #eceae2;      /* 主动作与选中：反白，不用彩色 */\n  --o-accent-ink: #0b0d10;\n  --o-signal: #6fc3df;\n  --o-warn: #f2a93b;\n  --o-alert: #e2523f;\n  --o-glow: none;\n  --o-grid: rgba(236, 234, 226, .04);\n  /* 涂装条四色：只出现在品牌位和一处主视觉 */\n  --o-stripe-1: #2b5c9e;\n  --o-stripe-2: #d6402b;\n  --o-stripe-3: #ec7d2a;\n  --o-stripe-4: #f2b33d;\n  --o-cut: 0px;\n  --o-radius: 3px;\n  --o-btn-cut: 0px;\n  --o-btn-radius: 3px;\n}\n\n/* ---------- 3. 基础 ---------- */\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--o-bg);\n  color: var(--o-text);\n  font: 400 var(--o-text-md)/1.65 var(--o-font-body);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* 坐标网格背景：只铺在需要“仪器感”的区域，不铺满每一页 */\n.o-grid-bg {\n  background-image:\n    linear-gradient(var(--o-grid) 1px, transparent 1px),\n    linear-gradient(90deg, var(--o-grid) 1px, transparent 1px);\n  background-size: 32px 32px;\n}\n\n/* 遥测数字：等宽 + 等宽数字，刷新时不跳动 */\n.o-mono,\n.o-readout {\n  font-family: var(--o-font-mono);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: .02em;\n}\n.o-readout {\n  font-size: var(--o-text-xl);\n  color: var(--o-accent);\n  line-height: 1.1;\n}\n.o-readout small {\n  font-size: var(--o-text-sm);\n  color: var(--o-text-dim);\n  margin-left: 4px;\n}\n\n.o-label {\n  font: 500 var(--o-text-sm)/1.4 var(--o-font-mono);\n  color: var(--o-text-dim);\n}\n\n.o-display {\n  font: 600 var(--o-text-hero)/1.05 var(--o-font-display);\n  letter-spacing: -.02em;\n  margin: 0;\n}\n.o-display:lang(zh) { line-height: 1.2; letter-spacing: 0; }\n\n/* ---------- 4. 面板：切角 + 细线，层级只靠底色和线的强弱 ---------- */\n.o-panel {\n  position: relative;\n  background: var(--o-surface);\n  border: var(--o-hairline) solid var(--o-line);\n  padding: var(--o-space-6);\n  border-radius: var(--o-radius);\n  clip-path: polygon(0 0, calc(100% - var(--o-cut)) 0, 100% var(--o-cut), 100% 100%, var(--o-cut) 100%, 0 calc(100% - var(--o-cut)));\n}\n[data-orbit=\"frontier\"] .o-panel { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }\n\n/* 四角定位标：表示“这里是一块被测量的区域”。一屏最多用在一处 */\n.o-brackets {\n  position: relative;\n  --b: 12px;\n  background:\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top left / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top left / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top right / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top right / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom left / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom left / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom right / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom right / 1px var(--b);\n  background-repeat: no-repeat;\n}\n\n/* ---------- 5. 控件：同一套语法——切角、等宽标签、按下下沉 1px ---------- */\n.o-btn {\n  --cut: var(--o-btn-cut, 8px);\n  border-radius: var(--o-btn-radius, 0);\n  display: inline-flex;\n  align-items: center;\n  gap: var(--o-space-2);\n  min-height: 40px;\n  padding: 0 var(--o-space-4);\n  border: var(--o-hairline) solid var(--o-line-strong);\n  background: transparent;\n  color: var(--o-text);\n  font: 500 var(--o-text-md)/1 var(--o-font-body);\n  cursor: pointer;\n  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);\n  transition: background var(--o-fast) var(--o-ease), color var(--o-fast) var(--o-ease), border-color var(--o-fast) var(--o-ease),\n    box-shadow var(--o-slow) var(--o-ease), transform var(--o-fast) var(--o-ease);\n  text-decoration: none;\n  position: relative;\n  overflow: hidden;\n}\n.o-btn:hover { background: var(--o-surface-2); border-color: var(--o-text); }\n.o-btn:active { transform: translateY(1px) scale(.985); }\n/* 悬停时一道细光从左扫到右，只扫一次 */\n.o-btn::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, currentColor 16%, transparent) 50%, transparent 70%);\n  transform: translateX(-110%);\n  pointer-events: none;\n}\n.o-btn:hover::before { transform: translateX(110%); transition: transform 700ms var(--o-ease); }\n.o-btn:focus-visible { outline: 2px solid var(--o-accent); outline-offset: 3px; }\n.o-btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }\n\n.o-btn--primary {\n  background: var(--o-accent);\n  border-color: var(--o-accent);\n  color: var(--o-accent-ink);\n  box-shadow: var(--o-glow);\n}\n.o-btn--primary:hover { background: color-mix(in srgb, var(--o-accent) 86%, white); border-color: color-mix(in srgb, var(--o-accent) 86%, white); }\n.o-btn--danger:hover { background: color-mix(in srgb, var(--o-alert) 12%, transparent); border-color: var(--o-alert); }\n\n.o-btn--danger { border-color: var(--o-alert); color: var(--o-alert); }\n\n/* 处理中：读数条从左扫到右，宽度不变 */\n.o-btn[aria-busy=\"true\"] { position: relative; pointer-events: none; }\n.o-btn[aria-busy=\"true\"]::after {\n  content: \"\";\n  position: absolute;\n  left: 0; bottom: 0;\n  height: 2px; width: 30%;\n  background: currentColor;\n  animation: o-sweep 1.1s var(--o-ease) infinite;\n}\n\n.o-input {\n  width: 100%;\n  min-height: 40px;\n  padding: 0 var(--o-space-3);\n  background: var(--o-bg);\n  border: var(--o-hairline) solid var(--o-line);\n  border-bottom-color: var(--o-line-strong);\n  color: var(--o-text);\n  font: 400 var(--o-text-md)/1 var(--o-font-mono);\n  border-radius: var(--o-radius);\n  transition: border-color var(--o-fast) var(--o-ease), box-shadow var(--o-slow) var(--o-ease);\n}\n.o-input:hover { border-bottom-color: var(--o-text); }\n.o-input[aria-invalid=\"true\"] { animation: o-shake 360ms var(--o-ease); }\n.o-input:focus { outline: none; border-color: var(--o-accent); box-shadow: inset 0 -2px 0 var(--o-accent); }\n.o-input[aria-invalid=\"true\"] { border-color: var(--o-alert); box-shadow: inset 0 -2px 0 var(--o-alert); }\n\n/* 状态灯：颜色 + 形状 + 文字三重表达，不只靠颜色 */\n.o-status {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font: 500 var(--o-text-sm)/1 var(--o-font-mono);\n  color: var(--o-text-dim);\n}\n.o-status::before {\n  content: \"\";\n  width: 8px; height: 8px;\n  background: var(--c, var(--o-signal));\n  box-shadow: 0 0 8px var(--c, var(--o-signal));\n}\n.o-status--nominal { --c: var(--o-signal); }\n.o-status--nominal::before { border-radius: 50%; animation: o-breathe 3.2s ease-in-out infinite; }\n.o-status--warn { --c: var(--o-warn); }\n.o-status--warn::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); animation: o-breathe 1.8s ease-in-out infinite; }\n.o-status--alert { --c: var(--o-alert); color: var(--o-alert); }\n.o-status--alert::before { animation: o-blink 1s steps(2) infinite; }\n\n/* 刻度条：替代普通进度条，读得出数值 */\n.o-gauge {\n  --v: 50;\n  height: 8px;\n  background:\n    repeating-linear-gradient(90deg, var(--o-line-strong) 0 1px, transparent 1px 10%),\n    var(--o-surface-2);\n  position: relative;\n}\n.o-gauge::after {\n  content: \"\";\n  position: absolute;\n  inset: 0 auto 0 0;\n  width: calc(var(--v) * 1%);\n  background: var(--o-accent);\n  transition: width var(--o-slow) var(--o-ease);\n  animation: o-fill var(--o-enter) var(--o-ease) both;\n  animation-delay: calc(200ms + var(--i, 0) * 80ms);\n}\n\n.o-divider {\n  height: 1px;\n  border: 0;\n  background: linear-gradient(90deg, var(--o-line-strong), transparent);\n  margin: var(--o-space-6) 0;\n}\n\n/* ---------- 6. 线条原语（星际拓荒方向的主语言，其他方向也可借用） ---------- */\n\n/* 涂装条：四色等宽色带。一页最多两处：品牌位 + 一处主视觉 */\n.o-stripe {\n  display: block;\n  height: var(--h, 4px);\n  width: var(--w, 72px);\n  background: linear-gradient(90deg,\n    var(--o-stripe-1, var(--o-accent)) 0 25%, var(--o-stripe-2, var(--o-accent)) 0 50%,\n    var(--o-stripe-3, var(--o-accent)) 0 75%, var(--o-stripe-4, var(--o-accent)) 0);\n  animation: o-wipe 700ms var(--o-ease) 120ms both;\n}\n\n/* 节点引线：起点实心圆点，终点短竖刻度。用来分区、连接标注与对象 */\n.o-rule {\n  position: relative;\n  height: 1px;\n  background: var(--o-line-strong);\n  margin: var(--o-space-6) 5px;\n  transform-origin: left;\n  animation: o-draw-x 900ms var(--o-ease) both;\n}\n.o-rule::before,\n.o-rule::after { content: \"\"; position: absolute; top: 50%; }\n.o-rule::before { left: -5px; width: 5px; height: 5px; border-radius: 50%; background: var(--o-line-strong); transform: translateY(-50%); }\n.o-rule::after { right: -1px; width: 1px; height: 9px; background: var(--o-line-strong); transform: translateY(-50%); }\n.o-rule--soft { background: var(--o-line); }\n\n/* 刻度环：一圈短刻度 + 一段读数弧。--v 是 0–100 的进度 */\n.o-arc {\n  --v: 60;\n  --size: 220px;\n  --track: var(--o-line);\n  position: relative;\n  width: var(--size);\n  aspect-ratio: 1;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  text-align: center;\n  transition: --v var(--o-slow) var(--o-ease);\n  animation: o-arc-in 1.2s var(--o-ease) 150ms backwards;\n}\n.o-arc::before,\n.o-arc::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: 50%;\n}\n/* 外圈刻度：每 6° 一格 */\n.o-arc::before {\n  background: repeating-conic-gradient(var(--track) 0 .6deg, transparent .6deg 6deg);\n  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 8px));\n          mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 8px));\n  animation: o-orbit 240s linear infinite; /* 刻度圈极慢地转，像仪表还活着 */\n}\n/* 内圈读数弧：细线，进度部分实线 */\n.o-arc::after {\n  inset: 14px;\n  background: conic-gradient(var(--o-accent) calc(var(--v) * 1%), var(--track) 0);\n  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));\n          mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));\n}\n\n/* 按键提示：游戏界面的 [E] 标记。挂在按钮或可操作项前面，键盘真的能触发时才用 */\n.o-key {\n  display: inline-grid;\n  place-items: center;\n  min-width: 22px;\n  height: 22px;\n  padding: 0 5px;\n  border: 1px solid currentColor;\n  border-radius: 4px;\n  font: 600 12px/1 var(--o-font-mono);\n  opacity: .9;\n}\n\n/* 菜单列表：选中行整行反白，左侧一条短标记。层级只靠反白与否，不加彩色 */\n.o-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }\n.o-list > li > a,\n.o-list > li > button {\n  display: flex;\n  width: 100%;\n  justify-content: space-between;\n  align-items: center;\n  gap: var(--o-space-3);\n  padding: 10px 14px;\n  border: 0;\n  background: transparent;\n  color: var(--o-text);\n  font: 500 var(--o-text-md)/1.3 var(--o-font-body);\n  text-align: left;\n  text-decoration: none;\n  cursor: pointer;\n  border-radius: var(--o-radius);\n  transition: background var(--o-fast) var(--o-ease), color var(--o-fast) var(--o-ease), padding var(--o-slow) var(--o-ease), box-shadow var(--o-slow) var(--o-ease);\n}\n.o-list > li > :hover { background: var(--o-surface-2); padding-left: 18px; }\n.o-list > li > [aria-current=\"true\"],\n.o-list > li > [aria-selected=\"true\"] {\n  background: var(--o-accent);\n  color: var(--o-accent-ink);\n  box-shadow: inset 3px 0 0 var(--o-stripe-3, var(--o-accent-ink));\n}\n.o-list small { font: 500 var(--o-text-sm)/1 var(--o-font-mono); opacity: .7; font-variant-numeric: tabular-nums; }\n\n/* 分段标签：胶囊外框，选中反白 */\n.o-tabs { display: inline-flex; gap: 4px; padding: 3px; border: 1px solid var(--o-line); border-radius: 999px; }\n.o-tabs > button {\n  border: 0; background: transparent; color: var(--o-text-dim);\n  font: 500 var(--o-text-sm)/1 var(--o-font-body);\n  padding: 7px 14px; border-radius: 999px; cursor: pointer;\n  transition: background var(--o-slow) var(--o-spring), color var(--o-fast) var(--o-ease), transform var(--o-fast) var(--o-ease);\n}\n.o-tabs > button:hover { color: var(--o-text); }\n.o-tabs > button:active { transform: scale(.96); }\n.o-tabs > [aria-selected=\"true\"] { background: var(--o-accent); color: var(--o-accent-ink); }\n\n/* 任务目标：空心圆 = 待办，实心圆 = 完成，圆环 = 进行中 */\n.o-objectives { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }\n.o-objectives li { display: grid; grid-template-columns: 14px 1fr auto; gap: 10px; align-items: baseline; }\n.o-objectives li::before {\n  content: \"\";\n  width: 10px; height: 10px;\n  border: 1.5px solid var(--o-line-strong);\n  border-radius: 50%;\n  transform: translateY(1px);\n}\n.o-objectives li[data-state=\"done\"] { color: var(--o-text-dim); }\n.o-objectives li[data-state=\"done\"]::before { background: var(--o-line-strong); }\n.o-objectives li[data-state=\"active\"]::before { border-color: var(--o-warn); box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn); animation: o-ring 2s ease-out infinite; }\n.o-objectives li[data-state=\"done\"]::before { animation: o-pop 420ms var(--o-spring) both; animation-delay: calc(300ms + var(--i, 0) * 90ms); }\n\n/* ---------- 7. 日常业务控件：开关、表格、步骤、头像 ---------- */\n\n/* 开关：轨道里一颗“卫星”，开 = 滑到右边并点亮 */\n.o-switch {\n  appearance: none;\n  -webkit-appearance: none;\n  position: relative;\n  width: 44px;\n  height: 24px;\n  margin: 0;\n  border: 1px solid var(--o-line-strong);\n  border-radius: 999px;\n  background: transparent;\n  cursor: pointer;\n  flex: none;\n  transition: background var(--o-fast) var(--o-ease), border-color var(--o-fast) var(--o-ease);\n}\n.o-switch::after {\n  content: \"\";\n  position: absolute;\n  top: 50%; left: 4px;\n  width: 14px;
