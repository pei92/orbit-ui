done\"]::after { background: var(--o-line-strong); }\n.o-track li[data-state=\"active\"]::before { border-color: var(--o-accent); background: var(--o-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--o-accent) 22%, transparent); animation: o-ping 2s ease-out infinite; }\n.o-track li[data-state=\"done\"]::after { transform-origin: top; animation: o-draw-y 500ms var(--o-ease) both; animation-delay: calc(200ms + var(--i, 0) * 120ms); }\n.o-track b { display: block; font-weight: 500; }\n.o-track small { color: var(--o-text-dim); font: 500 var(--o-text-sm)/1.5 var(--o-font-mono); font-variant-numeric: tabular-nums; }\n\n/* 头像 / 图标位：圆形细线框，内放首字 */\n.o-avatar {\n  display: inline-grid; place-items: center; flex: none;\n  width: 36px; height: 36px; border-radius: 50%;\n  border: 1px solid var(--o-line-strong);\n  font: 500 14px/1 var(--o-font-body);\n  color: var(--o-text);\n  background: var(--o-surface-2);\n  transition: border-color var(--o-fast) var(--o-ease), transform var(--o-slow) var(--o-spring);\n}\n.o-avatar:hover { border-color: var(--o-text); transform: scale(1.06); }\n\n/* ---------- 8. 动效原语 ---------- */\n@keyframes o-sweep { from { transform: translateX(0); } to { transform: translateX(240%); } }\n@keyframes o-blink { 50% { opacity: .2; } }\n@keyframes o-orbit { to { transform: rotate(360deg); } }\n@keyframes o-boot {\n  from { opacity: 0; clip-path: inset(0 100% 0 0); }\n  to { opacity: 1; clip-path: inset(0 0 0 0); }\n}\n@keyframes o-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n@keyframes o-fill { from { width: 0; } }\n@keyframes o-arc-in { from { --v: 0; } }\n@keyframes o-draw-x { from { transform: scaleX(0); } }\n@keyframes o-draw-y { from { transform: scaleY(0); } }\n@keyframes o-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }\n@keyframes o-breathe { 50% { opacity: .45; box-shadow: 0 0 2px var(--c, var(--o-signal)); } }\n@keyframes o-ring {\n  from { box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn), 0 0 0 0 color-mix(in srgb, var(--o-warn) 55%, transparent); }\n  to { box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn), 0 0 0 9px transparent; }\n}\n@keyframes o-ping {\n  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--o-accent) 60%, transparent); }\n  to { box-shadow: 0 0 0 11px transparent; }\n}\n@keyframes o-pop { from { transform: translateY(1px) scale(0); } }\n@keyframes o-shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }\n@keyframes o-tick { from { color: var(--o-text); text-shadow: 0 0 14px currentColor; } }\n@keyframes o-float { 50% { transform: translateY(-10px); } }\n@keyframes o-dash { to { stroke-dashoffset: 0; } }\n\n/* 面板启动：自左向右“上电”，同一屏依次延迟 60ms */\n.o-boot { animation: o-boot var(--o-slow) var(--o-ease) both; animation-delay: calc(var(--i, 0) * 60ms); }\n\n/* 浮现：内容块自下而上淡入。.o-stagger 的直接子元素依次延迟 70ms */\n.o-rise { animation: o-rise var(--o-enter) var(--o-ease) both; animation-delay: calc(var(--i, 0) * 70ms); }\n.o-stagger > * { animation: o-rise var(--o-enter) var(--o-ease) both; }\n.o-stagger > :nth-child(2) { animation-delay: 70ms; }\n.o-stagger > :nth-child(3) { animation-delay: 140ms; }\n.o-stagger > :nth-child(4) { animation-delay: 210ms; }\n.o-stagger > :nth-child(5) { animation-delay: 280ms; }\n.o-stagger > :nth-child(6) { animation-delay: 350ms; }\n.o-stagger > :nth-child(7) { animation-delay: 420ms; }\n.o-stagger > :nth-child(n+8) { animation-delay: 490ms; }\n\n/* 描线：SVG 路径从起点画到终点。路径上写 pathLength=\"1\"，--d 控制开始时间、--t 控制时长 */\n.o-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: o-dash var(--t, 1.4s) var(--o-ease) var(--d, .2s) forwards; }\n\n/* 读数刷新：数字变化时由脚本加上 .is-tick，亮一下再回到原色 */\n.o-tick.is-tick { animation: o-tick 600ms var(--o-ease); }\n\n/* 漂浮：给星球这类主视觉一点慢呼吸，周期 12 秒以上 */\n.o-float { animation: o-float var(--t, 14s) ease-in-out infinite; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }\n}\n<\/style>\n<style>\n  html, body { height: 100%; }\n  body { overflow: hidden; }\n  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }\n  /* 行星边缘：一束从左下打来的光，大气层是唯一的发光 */\n  .limb {\n    position: fixed; left: 50%; top: 74vh; width: 200vmax; height: 200vmax; transform: translateX(-50%);\n    border-radius: 50%;\n    background: radial-gradient(circle at 50% 0%, #1a1630 0%, #07060d 18%, #020205 40%);\n    box-shadow: 0 -2px 0 rgba(200,190,255,.55), 0 -20px 60px rgba(169,139,255,.35), 0 -80px 160px rgba(120,90,255,.18);\n    animation: dawn 2.4s var(--o-ease) both, breathe 10s ease-in-out 2.4s infinite;\n  }\n  /* 晨光从地平线下升起，之后像大气一样缓慢呼吸 */\n  @keyframes dawn { from { top: 92vh; opacity: 0; } }\n  @keyframes breathe { 50% { box-shadow: 0 -2px 0 rgba(200,190,255,.7), 0 -26px 80px rgba(169,139,255,.45), 0 -100px 200px rgba(120,90,255,.24); } }\n  .hero { position: relative; z-index: 1; height: 100%; display: grid; grid-template-rows: auto 1fr auto; padding: 32px clamp(20px, 5vw, 64px); }\n  nav { display: flex; justify-content: space-between; align-items: center; font: 500 15px/1 var(--o-font-display); }\n  nav a { color: var(--o-text-dim); text-decoration: none; font-size: 14px; }\n  .center { align-self: center; text-align: center; display: grid; gap: 28px; justify-items: center; margin-top: -8vh; }\n  .eyebrow { font: 400 13px/1 var(--o-font-mono); color: var(--o-text-dim); letter-spacing: .1em; }\n  h1 { font: 300 clamp(40px, 7vw, 104px)/1.12 var(--o-font-display); margin: 0; letter-spacing: -.01em; }\n  h1 em { font-style: normal; font-weight: 500; color: var(--o-accent); }\n  .lede { color: var(--o-text-dim); max-width: 30em; margin: 0; font-size: 16px; }\n  .cta { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }\n  .cta .o-btn { border-radius: 99px; clip-path: none; padding: 0 22px; min-height: 44px; }\n  .meta { display: flex; justify-content: center; gap: clamp(20px, 5vw, 64px); font: 400 13px/1.6 var(--o-font-mono); color: var(--o-text-dim); text-align: center; }\n  .meta b { display: block; color: var(--o-text); font-weight: 400; font-size: 18px; font-variant-numeric: tabular-nums; }\n<\/style>\n<\/head>\n<body>\n  <canvas id=\"sky\" aria-hidden=\"true\"><\/canvas>\n  <div class=\"limb\" aria-hidden=\"true\"><\/div>\n  <div class=\"hero\">\n    <nav><span>星砚航天<\/span><a href=\"#\">任务档案<\/a><\/nav>\n    <div class=\"center o-stagger\">\n      <span class=\"eyebrow\">10 月 18 日 02:14 UTC<\/span>\n      <h1>十二颗星，<br><em>同一道晨光<\/em><\/h1>\n      <p class=\"lede\">XY-07 雁阵把 12 颗遥感卫星送进 550 公里的晨昏轨道。它们会永远沿着昼夜分界线飞行，每天拍下同一时刻的地球。<\/p>\n      <div class=\"cta\">\n        <a class=\"o-btn o-btn--primary\" href=\"#\">观看直播<\/a>\n        <a class=\"o-btn\" href=\"#\">发射前 10 分钟提醒我<\/a>\n      <\/div>\n    <\/div>\n    <div class=\"meta o-stagger\">\n      <span>距点火<b id=\"t\">01:42:17<\/b><\/span>\n      <span>轨道高度<b>550 km<\/b><\/span>\n      <span>载荷<b>12 颗<\/b><\/span>\n    <\/div>\n  <\/div>\n<script>\n  // 两层视差星点，静止不闪；只有一颗“信号星”呼吸\n  const c = document.getElementById(\"sky\"), x = c.getContext(\"2d\");\n  let stars = [];\n  function seed() {\n    const d = devicePixelRatio || 1;\n    c.width = innerWidth * d; c.height = innerHeight * d; x.setTransform(d, 0, 0, d, 0, 0);\n    const n = Math.round(innerWidth * innerHeight / 8000);\n    let s = 7;\n    const r = () => (s = (s * 16807) % 2147483647) / 2147483647;\n    stars = Array.from({ length: n }, () => ({ x: r() * innerWidth, y: r() * innerHeight, z: r() < .8 ? .4 : 1, a: .3 + r() * .6 }));\n  }\n  function draw(t) {\n    x.clearRect(0, 0, innerWidth, innerHeight);\n    for (const p of stars) {\n      x.globalAlpha = p.a;\n      x.fillStyle = \"#e8e6ff\";\n      x.fillRect((p.x + t * .004 * p.z) % innerWidth, p.y, p.z, p.z);\n    }\n    x.globalAlpha = .6 + Math.sin(t / 900) * .4;\n    x.fillStyle = \"#a98bff\";\n    x.beginPath(); x.arc(innerWidth * .72, innerHeight * .22, 1.6, 0, 7); x.fill();\n    if (!matchMedia(\"(prefers-reduced-motion: reduce)\").matches) requestAnimationFrame(draw);\n  }\n  addEventListener(\"resize\", seed); seed(); requestAnimationFrame(draw);\n  let s = 1 * 3600 + 42 * 60 + 17;\n  const t = document.getElementById(\"t\"), p = n => String(n).padStart(2, \"0\");\n  setInterval(() => { s = Math.max(0, s - 1); t.textContent = `${p(s / 3600 | 0)}:${p((s / 60 | 0) % 60)}:${p(s % 60)}`; }, 1000);\n<\/script>\n<\/body>\n<\/html>\n"}, {"id": "frontier", "name": "星际拓荒", "concept": "像在飞船舷窗边打开任务日志：星球就在眼前，下一步只差按一个键", "typography": "Jost 300 大标题 76px / Barlow 正文 16px / Barlow Semi Condensed 读数", "palette": ["#0b0d10", "#eceae2", "#2b5c9e", "#d6402b", "#ec7d2a", "#f2b33d"], "traits": ["星球占半屏、引线标注", "刻度环倒计时", "任务目标清单", "选中反白 + 按键提示", "四色涂装条"], "baseline": false, "viewport": null, "kind": "html", "html": "<!doctype html>\n<html lang=\"zh-CN\" data-orbit=\"frontier\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>XY-07 雁阵 · 星际拓荒<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&display=swap\">\n<style>/* orbit.css */\n/*\n * Orbit UI — 太空科技感设计令牌与控件语法\n *\n * 用法：<link rel=\"stylesheet\" href=\"orbit.css\">，在 <html> 上写 data-orbit=\"mission|blueprint|deepfield\"\n * 选一个方向。三个方向共用同一套变量名，组件只引用变量，不写死颜色。\n * 小样里直接复制本文件到任务目录再引用，不走 CDN。\n */\n\n/* ---------- 1. 基础令牌：所有方向共享 ---------- */\n:root {\n  /* 字体：展示字 / 正文 / 遥测数据。中文回退放在拉丁字之后 */\n  --o-font-display: \"Space Grotesk\", \"Sora\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-body: \"Inter\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-mono: \"JetBrains Mono\", \"IBM Plex Mono\", \"SFMono-Regular\", Consolas, \"Microsoft YaHei\", monospace;\n\n  /* 字号：正文 15，数据 13 起，展示字靠 clamp 跟视口走 */\n  --o-text-xs: 12px;\n  --o-text-sm: 13px;\n  --o-text-md: 15px;\n  --o-text-lg: 18px;\n  --o-text-xl: clamp(24px, 2.4vw, 32px);\n  --o-text-hero: clamp(40px, 6vw, 88px);\n\n  /* 间距：4 的倍数，组内用 2–3，组间用 6–10 */\n  --o-space-1: 4px;\n  --o-space-2: 8px;\n  --o-space-3: 12px;\n  --o-space-4: 16px;\n  --o-space-6: 24px;\n  --o-space-8: 32px;\n  --o-space-12: 48px;\n  --o-space-16: 64px;\n\n  /* 形状：仪器感来自小圆角 + 切角，不来自大圆角 */\n  --o-radius: 2px;\n  --o-cut: 10px; /* 切角尺寸，用于面板与主按钮 */\n  --o-hairline: 1px;\n\n  /* 动效：仪器只有两种节奏——读数刷新与舱门开合 */\n  --o-ease: cubic-bezier(.2, .7, .1, 1);\n  --o-fast: 140ms;\n  --o-slow: 420ms;\n  --o-spring: cubic-bezier(.34, 1.45, .64, 1); /* 开关、选中：落定时轻微过冲 */\n  --o-enter: 720ms;                             /* 首次进入：读数归位、弧线充满 */\n}\n\n/* 让 --v 可以被过渡和动画：刻度环、刻度条从 0 读到目标值 */\n@property --v { syntax: \"<number>\"; inherits: true; initial-value: 0; }\n\n/* ---------- 2. 方向令牌：一个方向只有一个主角色 ---------- */\n\n/* 任务控制台：深炭底 + 琥珀读数，像发射场的 CRT 控制台。主角是数据 */\n:root,\n[data-orbit=\"mission\"] {\n  --o-bg: #07090c;\n  --o-surface: #0e1217;\n  --o-surface-2: #151b22;\n  --o-line: rgba(255, 196, 92, .16);\n  --o-line-strong: rgba(255, 196, 92, .42);\n  --o-text: #e9e4d8;\n  --o-text-dim: #9a968c;\n  --o-accent: #ffb547;      /* 琥珀：主动作与关键读数 */\n  --o-accent-ink: #1a1206;\n  --o-signal: #5be3b0;      /* 正常 / 链路通 */\n  --o-warn: #ffd166;\n  --o-alert: #ff5a4e;       /* 中止 / 故障 */\n  --o-glow: 0 0 24px rgba(255, 181, 71, .28);\n  --o-grid: rgba(255, 196, 92, .05);\n}\n\n/* 轨道蓝图：钴蓝底 + 白色细线，像工程图纸与星图。主角是轨迹线 */\n[data-orbit=\"blueprint\"] {\n  --o-bg: #0a1a3a;\n  --o-surface: #0f2350;\n  --o-surface-2: #142c62;\n  --o-line: rgba(214, 228, 255, .2);\n  --o-line-strong: rgba(214, 228, 255, .6);\n  --o-text: #f1f5ff;\n  --o-text-dim: #a9b8dc;\n  --o-accent: #f1f5ff;\n  --o-accent-ink: #0a1a3a;\n  --o-signal: #7fe7ff;\n  --o-warn: #ffe08a;\n  --o-alert: #ff7a6b;\n  --o-glow: none;\n  --o-grid: rgba(214, 228, 255, .07);\n}\n\n/* 深空：近黑底 + 离子白 + 一点等离子紫，像深场望远镜照片。主角是留白与一束光 */\n[data-orbit=\"deepfield\"] {\n  --o-bg: #020205;\n  --o-surface: #0a0a12;\n  --o-surface-2: #12121d;\n  --o-line: rgba(200, 200, 255, .1);\n  --o-line-strong: rgba(200, 200, 255, .3);\n  --o-text: #f4f3ff;\n  --o-text-dim: #8d8ba6;\n  --o-accent: #a98bff;\n  --o-accent-ink: #0b0618;\n  --o-signal: #8cf5d2;\n  --o-warn: #ffd98a;\n  --o-alert: #ff6b8b;\n  --o-glow: 0 0 40px rgba(169, 139, 255, .35);\n  --o-grid: rgba(200, 200, 255, .035);\n}\n\n/* 星际拓荒（NASA-punk）：参考 Starfield 的界面语言——石墨底、暖白细线、\n * 选中项反白、端点带圆点的引线、四色涂装条。主角是“被标注的星球”和反白的那一行 */\n[data-orbit=\"frontier\"] {\n  --o-font-display: \"Jost\", \"Futura\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", sans-serif;\n  --o-font-body: \"Barlow\", \"HarmonyOS Sans SC\", \"PingFang SC\", \"Microsoft YaHei\", system-ui, sans-serif;\n  --o-font-mono: \"Barlow Semi Condensed\", \"Barlow\", \"Microsoft YaHei\", sans-serif; /* 读数不用等宽，用 tabular-nums 对齐 */\n  --o-bg: #0b0d10;\n  --o-surface: rgba(22, 26, 31, .78);\n  --o-surface-2: rgba(38, 43, 50, .85);\n  --o-line: rgba(236, 234, 226, .18);\n  --o-line-strong: rgba(236, 234, 226, .62);\n  --o-text: #eceae2;\n  --o-text-dim: #9aa0a6;\n  --o-accent: #eceae2;      /* 主动作与选中：反白，不用彩色 */\n  --o-accent-ink: #0b0d10;\n  --o-signal: #6fc3df;\n  --o-warn: #f2a93b;\n  --o-alert: #e2523f;\n  --o-glow: none;\n  --o-grid: rgba(236, 234, 226, .04);\n  /* 涂装条四色：只出现在品牌位和一处主视觉 */\n  --o-stripe-1: #2b5c9e;\n  --o-stripe-2: #d6402b;\n  --o-stripe-3: #ec7d2a;\n  --o-stripe-4: #f2b33d;\n  --o-cut: 0px;\n  --o-radius: 3px;\n  --o-btn-cut: 0px;\n  --o-btn-radius: 3px;\n}\n\n/* ---------- 3. 基础 ---------- */\n*,\n*::before,\n*::after { box-sizing: border-box; }\n\nbody {\n  margin: 0;\n  background: var(--o-bg);\n  color: var(--o-text);\n  font: 400 var(--o-text-md)/1.65 var(--o-font-body);\n  -webkit-font-smoothing: antialiased;\n}\n\n/* 坐标网格背景：只铺在需要“仪器感”的区域，不铺满每一页 */\n.o-grid-bg {\n  background-image:\n    linear-gradient(var(--o-grid) 1px, transparent 1px),\n    linear-gradient(90deg, var(--o-grid) 1px, transparent 1px);\n  background-size: 32px 32px;\n}\n\n/* 遥测数字：等宽 + 等宽数字，刷新时不跳动 */\n.o-mono,\n.o-readout {\n  font-family: var(--o-font-mono);\n  font-variant-numeric: tabular-nums;\n  letter-spacing: .02em;\n}\n.o-readout {\n  font-size: var(--o-text-xl);\n  color: var(--o-accent);\n  line-height: 1.1;\n}\n.o-readout small {\n  font-size: var(--o-text-sm);\n  color: var(--o-text-dim);\n  margin-left: 4px;\n}\n\n.o-label {\n  font: 500 var(--o-text-sm)/1.4 var(--o-font-mono);\n  color: var(--o-text-dim);\n}\n\n.o-display {\n  font: 600 var(--o-text-hero)/1.05 var(--o-font-display);\n  letter-spacing: -.02em;\n  margin: 0;\n}\n.o-display:lang(zh) { line-height: 1.2; letter-spacing: 0; }\n\n/* ---------- 4. 面板：切角 + 细线，层级只靠底色和线的强弱 ---------- */\n.o-panel {\n  position: relative;\n  background: var(--o-surface);\n  border: var(--o-hairline) solid var(--o-line);\n  padding: var(--o-space-6);\n  border-radius: var(--o-radius);\n  clip-path: polygon(0 0, calc(100% - var(--o-cut)) 0, 100% var(--o-cut), 100% 100%, var(--o-cut) 100%, 0 calc(100% - var(--o-cut)));\n}\n[data-orbit=\"frontier\"] .o-panel { backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }\n\n/* 四角定位标：表示“这里是一块被测量的区域”。一屏最多用在一处 */\n.o-brackets {\n  position: relative;\n  --b: 12px;\n  background:\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top left / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top left / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top right / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) top right / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom left / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom left / 1px var(--b),\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom right / var(--b) 1px,\n    linear-gradient(var(--o-line-strong), var(--o-line-strong)) bottom right / 1px var(--b);\n  background-repeat: no-repeat;\n}\n\n/* ---------- 5. 控件：同一套语法——切角、等宽标签、按下下沉 1px ---------- */\n.o-btn {\n  --cut: var(--o-btn-cut, 8px);\n  border-radius: var(--o-btn-radius, 0);\n  display: inline-flex;\n  align-items: center;\n  gap: var(--o-space-2);\n  min-height: 40px;\n  padding: 0 var(--o-space-4);\n  border: var(--o-hairline) solid var(--o-line-strong);\n  background: transparent;\n  color: var(--o-text);\n  font: 500 var(--o-text-md)/1 var(--o-font-body);\n  cursor: pointer;\n  clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, 0 100%);\n  transition: background var(--o-fast) var(--o-ease), color var(--o-fast) var(--o-ease), border-color var(--o-fast) var(--o-ease),\n    box-shadow var(--o-slow) var(--o-ease), transform var(--o-fast) var(--o-ease);\n  text-decoration: none;\n  position: relative;\n  overflow: hidden;\n}\n.o-btn:hover { background: var(--o-surface-2); border-color: var(--o-text); }\n.o-btn:active { transform: translateY(1px) scale(.985); }\n/* 悬停时一道细光从左扫到右，只扫一次 */\n.o-btn::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, currentColor 16%, transparent) 50%, transparent 70%);\n  transform: translateX(-110%);\n  pointer-events: none;\n}\n.o-btn:hover::before { transform: translateX(110%); transition: transform 700ms var(--o-ease); }\n.o-btn:focus-visible { outline: 2px solid var(--o-accent); outline-offset: 3px; }\n.o-btn[disabled] { opacity: .4; cursor: not-allowed; transform: none; }\n\n.o-btn--primary {\n  background: var(--o-accent);\n  border-color: var(--o-accent);\n  color: var(--o-accent-ink);\n  box-shadow: var(--o-glow);\n}\n.o-btn--primary:hover { background: color-mix(in srgb, var(--o-accent) 86%, white); border-color: color-mix(in srgb, var(--o-accent) 86%, white); }\n.o-btn--danger:hover { background: color-mix(in srgb, var(--o-alert) 12%, transparent); border-color: var(--o-alert); }\n\n.o-btn--danger { border-color: var(--o-alert); color: var(--o-alert); }\n\n/* 处理中：读数条从左扫到右，宽度不变 */\n.o-btn[aria-busy=\"true\"] { position: relative; pointer-events: none; }\n.o-btn[aria-busy=\"true\"]::after {\n  content: \"\";\n  position: absolute;\n  left: 0; bottom: 0;\n  height: 2px; width: 30%;\n  background: currentColor;\n  animation: o-sweep 1.1s var(--o-ease) infinite;\n}\n\n.o-input {\n  width: 100%;\n  min-height: 40px;\n  padding: 0 var(--o-space-3);\n  background: var(--o-bg);\n  border: var(--o-hairline) solid var(--o-line);\n  border-bottom-color: var(--o-line-strong);\n  color: var(--o-text);\n  font: 400 var(--o-text-md)/1 var(--o-font-mono);\n  border-radius: var(--o-radius);\n  transition: border-color var(--o-fast) var(--o-ease), box-shadow var(--o-slow) var(--o-ease);\n}\n.o-input:hover { border-bottom-color: var(--o-text); }\n.o-input[aria-invalid=\"true\"] { animation: o-shake 360ms var(--o-ease); }\n.o-input:focus { outline: none; border-color: var(--o-accent); box-shadow: inset 0 -2px 0 var(--o-accent); }\n.o-input[aria-invalid=\"true\"] { border-color: var(--o-alert); box-shadow: inset 0 -2px 0 var(--o-alert); }\n\n/* 状态灯：颜色 + 形状 + 文字三重表达，不只靠颜色 */\n.o-status {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  font: 500 var(--o-text-sm)/1 var(--o-font-mono);\n  color: var(--o-text-dim);\n}\n.o-status::before {\n  content: \"\";\n  width: 8px; height: 8px;\n  background: var(--c, var(--o-signal));\n  box-shadow: 0 0 8px var(--c, var(--o-signal));\n}\n.o-status--nominal { --c: var(--o-signal); }\n.o-status--nominal::before { border-radius: 50%; animation: o-breathe 3.2s ease-in-out infinite; }\n.o-status--warn { --c: var(--o-warn); }\n.o-status--warn::before { clip-path: polygon(50% 0, 100% 100%, 0 100%); animation: o-breathe 1.8s ease-in-out infinite; }\n.o-status--alert { --c: var(--o-alert); color: var(--o-alert); }\n.o-status--alert::before { animation: o-blink 1s steps(2) infinite; }\n\n/* 刻度条：替代普通进度条，读得出数值 */\n.o-gauge {\n  --v: 50;\n  height: 8px;\n  background:\n    repeating-linear-gradient(90deg, var(--o-line-strong) 0 1px, transparent 1px 10%),\n    var(--o-surface-2);\n  position: relative;\n}\n.o-gauge::after {\n  content: \"\";\n  position: absolute;\n  inset: 0 auto 0 0;\n  width: calc(var(--v) * 1%);\n  background: var(--o-accent);\n  transition: width var(--o-slow) var(--o-ease);\n  animation: o-fill var(--o-enter) var(--o-ease) both;\n  animation-delay: calc(200ms + var(--i, 0) * 80ms);\n}\n\n.o-divider {\n  height: 1px;\n  border: 0;\n  background: linear-gradient(90deg, var(--o-line-strong), transparent);\n  margin: var(--o-space-6) 0;\n}\n\n/* ---------- 6. 线条原语（星际拓荒方向的主语言，其他方向也可借用） ---------- */\n\n/* 涂装条：四色等宽色带。一页最多两处：品牌位 + 一处主视觉 */\n.o-stripe {\n  display: block;\n  height: var(--h, 4px);\n  width: var(--w, 72px);\n  background: linear-gradient(90deg,\n    var(--o-stripe-1, var(--o-accent)) 0 25%, var(--o-stripe-2, var(--o-accent)) 0 50%,\n    var(--o-stripe-3, var(--o-accent)) 0 75%, var(--o-stripe-4, var(--o-accent)) 0);\n  animation: o-wipe 700ms var(--o-ease) 120ms both;\n}\n\n/* 节点引线：起点实心圆点，终点短竖刻度。用来分区、连接标注与对象 */\n.o-rule {\n  position: relative;\n  height: 1px;\n  background: var(--o-line-strong);\n  margin: var(--o-space-6) 5px;\n  transform-origin: left;\n  animation: o-draw-x 900ms var(--o-ease) both;\n}\n.o-rule::before,\n.o-rule::after { content: \"\"; position: absolute; top: 50%; }\n.o-rule::before { left: -5px; width: 5px; height: 5px; border-radius: 50%; background: var(--o-line-strong); transform: translateY(-50%); }\n.o-rule::after { right: -1px; width: 1px; height: 9px; background: var(--o-line-strong); transform: translateY(-50%); }\n.o-rule--soft { background: var(--o-line); }\n\n/* 刻度环：一圈短刻度 + 一段读数弧。--v 是 0–100 的进度 */\n.o-arc {\n  --v: 60;\n  --size: 220px;\n  --track: var(--o-line);\n  position: relative;\n  width: var(--size);\n  aspect-ratio: 1;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  text-align: center;\n  transition: --v var(--o-slow) var(--o-ease);\n  animation: o-arc-in 1.2s var(--o-ease) 150ms backwards;\n}\n.o-arc::before,\n.o-arc::after {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  border-radius: 50%;\n}\n/* 外圈刻度：每 6° 一格 */\n.o-arc::before {\n  background: repeating-conic-gradient(var(--track) 0 .6deg, transparent .6deg 6deg);\n  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 8px));\n          mask: radial-gradient(farthest-side, transparent calc(100% - 8px), #000 calc(100% - 8px));\n  animation: o-orbit 240s linear infinite; /* 刻度圈极慢地转，像仪表还活着 */\n}\n/* 内圈读数弧：细线，进度部分实线 */\n.o-arc::after {\n  inset: 14px;\n  background: conic-gradient(var(--o-accent) calc(var(--v) * 1%), var(--track) 0);\n  -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));\n          mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));\n}\n\n/* 按键提示：游戏界面的 [E] 标记。挂在按钮或可操作项前面，键盘真的能触发时才用 */\n.o-key {\n  display: inline-grid;\n  place-items: center;\n  min-width: 22px;\n  height: 22px;\n  padding: 0 5px;\n  border: 1px solid currentColor;\n  border-radius: 4px;\n  font: 600 12px/1 var(--o-font-mono);\n  opacity: .9;\n}\n\n/* 菜单列表：选中行整行反白，左侧一条短标记。层级只靠反白与否，不加彩色 */\n.o-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }\n.o-list > li > a,\n.o-list > li > button {\n  display: flex;\n  width: 100%;\n  justify-content: space-between;\n  align-items: center;\n  gap: var(--o-space-3);\n  padding: 10px 14px;\n  border: 0;\n  background: transparent;\n  color: var(--o-text);\n  font: 500 var(--o-text-md)/1.3 var(--o-font-body);\n  text-align: left;\n  text-decoration: none;\n  cursor: pointer;\n  border-radius: var(--o-radius);\n  transition: background var(--o-fast) var(--o-ease), color var(--o-fast) var(--o-ease), padding var(--o-slow) imation-delay: calc(300ms + var(--i, 0) * 90ms); }\n\n/* ---------- 7. 日常业务控件：开关、表格、步骤、头像 ---------- */\n\n/* 开关：轨道里一颗“卫星”，开 = 滑到右边并点亮 */\n.o-switch {\n  appearance: none;\n  -webkit-appearance: none;\n  position: relative;\n  width: 44px;\n  height: 24px;\n  margin: 0;\n  border: 1px solid var(--o-line-strong);\n  border-radius: 999px;\n  background: transparent;\n  cursor: pointer;\n  flex: none;\n  transition: background var(--o-fast) var(--o-ease), border-color var(--o-fast) var(--o-ease);\n}\n.o-switch::after {\n  content: \"\";\n  position: absolute;\n  top: 50%; left: 4px;\n  width: 14px; height: 14px;\n  border-radius: 50%;\n  background: var(--o-text-dim);\n  transform: translateY(-50%);\n  transition: transform var(--o-slow) var(--o-spring), background var(--o-fast) var(--o-ease), box-shadow var(--o-slow) var(--o-ease);\n}\n.o-switch:checked { border-color: var(--o-accent); background: color-mix(in srgb, var(--o-accent) 18%, transparent); }\n.o-switch:checked::after { transform: translate(20px, -50%); background: var(--o-accent); box-shadow: 0 0 10px color-mix(in srgb, var(--o-accent) 60%, transparent); }\n.o-switch:focus-visible { outline: 2px solid var(--o-accent); outline-offset: 3px; }\n\n/* 表格：给人扫视和比较。数字列右对齐、等宽数字；行间只用一条弱线 */\n.o-table { width: 100%; border-collapse: collapse; font-size: var(--o-text-md); }\n.o-table th {\n  text-align: left;\n  font: 500 var(--o-text-sm)/1.3 var(--o-font-body);\n  color: var(--o-text-dim);\n  padding: 10px 12px;\n  border-bottom: 1px solid var(--o-line-strong);\n  white-space: nowrap;\n}\n.o-table td { padding: 12px; border-bottom: 1px solid var(--o-line); vertical-align: middle; }\n.o-table .num { text-align: right; font-family: var(--o-font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }\n.o-table tbody tr { transition: background var(--o-fast) var(--o-ease); }\n.o-table tbody tr:hover { background: var(--o-surface-2); }\n\n/* 步骤轨迹：订单、物流、审批。竖线是“轨迹”，节点是“检查点” */\n.o-track { list-style: none; margin: 0; padding: 0; }\n.o-track li { position: relative; padding: 0 0 18px 26px; }\n.o-track li::before {\n  content: \"\";\n  position: absolute; left: 4px; top: 6px;\n  width: 9px; height: 9px; border-radius: 50%;\n  border: 1.5px solid var(--o-line-strong);\n  background: var(--o-bg);\n  z-index: 1;\n}\n.o-track li::after {\n  content: \"\";\n  position: absolute; left: 8px; top: 10px; bottom: -6px;\n  width: 1px; background: var(--o-line);\n}\n.o-track li:last-child::after { display: none; }\n.o-track li[data-state=\"done\"]::before { background: var(--o-line-strong); }\n.o-track li[data-state=\"done\"]::after { background: var(--o-line-strong); }\n.o-track li[data-state=\"active\"]::before { border-color: var(--o-accent); background: var(--o-accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--o-accent) 22%, transparent); animation: o-ping 2s ease-out infinite; }\n.o-track li[data-state=\"done\"]::after { transform-origin: top; animation: o-draw-y 500ms var(--o-ease) both; animation-delay: calc(200ms + var(--i, 0) * 120ms); }\n.o-track b { display: block; font-weight: 500; }\n.o-track small { color: var(--o-text-dim); font: 500 var(--o-text-sm)/1.5 var(--o-font-mono); font-variant-numeric: tabular-nums; }\n\n/* 头像 / 图标位：圆形细线框，内放首字 */\n.o-avatar {\n  display: inline-grid; place-items: center; flex: none;\n  width: 36px; height: 36px; border-radius: 50%;\n  border: 1px solid var(--o-line-strong);\n  font: 500 14px/1 var(--o-font-body);\n  color: var(--o-text);\n  background: var(--o-surface-2);\n  transition: border-color var(--o-fast) var(--o-ease), transform var(--o-slow) var(--o-spring);\n}\n.o-avatar:hover { border-color: var(--o-text); transform: scale(1.06); }\n\n/* ---------- 8. 动效原语 ---------- */\n@keyframes o-sweep { from { transform: translateX(0); } to { transform: translateX(240%); } }\n@keyframes o-blink { 50% { opacity: .2; } }\n@keyframes o-orbit { to { transform: rotate(360deg); } }\n@keyframes o-boot {\n  from { opacity: 0; clip-path: inset(0 100% 0 0); }\n  to { opacity: 1; clip-path: inset(0 0 0 0); }\n}\n@keyframes o-rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }\n@keyframes o-fill { from { width: 0; } }\n@keyframes o-arc-in { from { --v: 0; } }\n@keyframes o-draw-x { from { transform: scaleX(0); } }\n@keyframes o-draw-y { from { transform: scaleY(0); } }\n@keyframes o-wipe { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }\n@keyframes o-breathe { 50% { opacity: .45; box-shadow: 0 0 2px var(--c, var(--o-signal)); } }\n@keyframes o-ring {\n  from { box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn), 0 0 0 0 color-mix(in srgb, var(--o-warn) 55%, transparent); }\n  to { box-shadow: inset 0 0 0 2px var(--o-bg), inset 0 0 0 5px var(--o-warn), 0 0 0 9px transparent; }\n}\n@keyframes o-ping {\n  from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--o-accent) 60%, transparent); }\n  to { box-shadow: 0 0 0 11px transparent; }\n}\n@keyframes o-pop { from { transform: translateY(1px) scale(0); } }\n@keyframes o-shake { 20%, 60% { transform: translateX(-3px); } 40%, 80% { transform: translateX(3px); } }\n@keyframes o-tick { from { color: var(--o-text); text-shadow: 0 0 14px currentColor; } }\n@keyframes o-float { 50% { transform: translateY(-10px); } }\n@keyframes o-dash { to { stroke-dashoffset: 0; } }\n\n/* 面板启动：自左向右“上电”，同一屏依次延迟 60ms */\n.o-boot { animation: o-boot var(--o-slow) var(--o-ease) both; animation-delay: calc(var(--i, 0) * 60ms); }\n\n/* 浮现：内容块自下而上淡入。.o-stagger 的直接子元素依次延迟 70ms */\n.o-rise { animation: o-rise var(--o-enter) var(--o-ease) both; animation-delay: calc(var(--i, 0) * 70ms); }\n.o-stagger > * { animation: o-rise var(--o-enter) var(--o-ease) both; }\n.o-stagger > :nth-child(2) { animation-delay: 70ms; }\n.o-stagger > :nth-child(3) { animation-delay: 140ms; }\n.o-stagger > :nth-child(4) { animation-delay: 210ms; }\n.o-stagger > :nth-child(5) { animation-delay: 280ms; }\n.o-stagger > :nth-child(6) { animation-delay: 350ms; }\n.o-stagger > :nth-child(7) { animation-delay: 420ms; }\n.o-stagger > :nth-child(n+8) { animation-delay: 490ms; }\n\n/* 描线：SVG 路径从起点画到终点。路径上写 pathLength=\"1\"，--d 控制开始时间、--t 控制时长 */\n.o-draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: o-dash var(--t, 1.4s) var(--o-ease) var(--d, .2s) forwards; }\n\n/* 读数刷新：数字变化时由脚本加上 .is-tick，亮一下再回到原色 */\n.o-tick.is-tick { animation: o-tick 600ms var(--o-ease); }\n\n/* 漂浮：给星球这类主视觉一点慢呼吸，周期 12 秒以上 */\n.o-float { animation: o-float var(--t, 14s) ease-in-out infinite; }\n\n@media (prefers-reduced-motion: reduce) {\n  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }\n}\n<\/style>\n<style>\n  html, body { height: 100%; }\n  body {\n    overflow-x: hidden;\n    /* 静态星点：三层不同大小，不闪 */\n    background:\n      radial-gradient(1px 1px at 12% 18%, #fff8 50%, transparent 51%),\n      radial-gradient(1px 1px at 34% 72%, #fff6 50%, transparent 51%),\n      radial-gradient(1.5px 1.5px at 48% 12%, #fffa 50%, transparent 51%),\n      radial-gradient(1px 1px at 62% 88%, #fff5 50%, transparent 51%),\n      radial-gradient(1px 1px at 88% 8%, #fff7 50%, transparent 51%),\n      radial-gradient(1px 1px at 22% 46%, #fff4 50%, transparent 51%),\n      radial-gradient(1.5px 1.5px at 6% 84%, #fff8 50%, transparent 51%),\n      var(--o-bg);\n  }\n  .page { position: relative; min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; }\n\n  /* ---- 星球：一束从左上来的硬光，暗面融进背景 ---- */\n  .world { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }\n  .planet {\n    position: absolute; right: -6vw; top: 50%; width: min(78vh, 62vw); aspect-ratio: 1; transform: translateY(-46%);\n    border-radius: 50%;\n    background:\n      radial-gradient(circle at 32% 30%, rgba(255,236,206,.55), transparent 38%),\n      repeating-linear-gradient(-18deg, rgba(0,0,0,0) 0 22px, rgba(60,30,18,.18) 22px 30px, rgba(0,0,0,0) 30px 58px),\n      radial-gradient(circle at 36% 36%, #d9b48a 0%, #b07a52 26%, #6b3f2a 50%, #24140f 72%, #0b0d10 86%);\n    box-shadow: inset -40px -30px 80px rgba(11,13,16,.9);\n  }\n  .callouts { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }\n  /* 标注牌：压在星球亮面上也读得清 */\n  .tag {\n    position: absolute; transform: translateY(-50%); display: grid; gap: 2px; white-space: nowrap;\n    padding: 7px 10px; background: rgba(11,13,16,.74); border: 1px solid var(--o-line); border-radius: 3px;\n    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);\n  }\n  .tag b { font: 500 13px/1.3 var(--o-font-body); }\n  .tag span { font: 500 12px/1.3 var(--o-font-mono); color: var(--o-text-dim); }\n\n  /* 星球慢慢浮动；轨道上的亮段绕着走；标注在引线画完后才亮起 */\n  .world { animation: o-float 18s ease-in-out infinite; }\n  .glint { animation: glint 9s linear infinite; }\n  @keyframes glint { from { stroke-dashoffset: 12; } to { stroke-dashoffset: -100; } }\n  .tag { animation: tag-in .6s var(--o-ease) both; }\n  @keyframes tag-in { from { opacity: 0; } }\n\n  /* ---- 顶栏 ---- */\n  .top { position: relative; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 24px clamp(20px, 4vw, 56px); }\n  .brand { display: grid; gap: 8px; }\n  .brand b { font: 500 16px/1 var(--o-font-display); letter-spacing: .02em; }\n  .brand span { color: var(--o-text-dim); font: 500 13px/1 var(--o-font-mono); }\n\n  /* ---- 左栏 ---- */\n  .main { position: relative; padding: 0 clamp(20px, 4vw, 56px); display: grid; align-content: center; gap: 28px; max-width: 640px; }\n  h1 { font: 300 clamp(40px, 5.2vw, 76px)/1.15 var(--o-font-display); margin: 0; letter-spacing: .01em; }\n  h1 .nb { white-space: nowrap; }\n  .lede { margin: 0; color: var(--o-text-dim); font-size: 16px; max-width: 32em; }\n  .status { display: grid; grid-template-columns: auto 1fr; gap: 24px; align-items: center; }\n  .o-arc { --size: 176px; --v: 72; }\n  .arc-read { display: grid; gap: 4px; }\n  .arc-read .o-label { font-family: var(--o-font-body); }\n  .arc-read b { font: 500 30px/1 var(--o-font-mono); font-variant-numeric: tabular-nums; letter-spacing: .02em; }\n  .o-panel { padding: 18px 20px; }\n  .o-panel h2 { margin: 0 0 14px; font: 600 13px/1 var(--o-font-body); color: var(--o-text-dim); display: flex; justify-content: space-between; }\n  .o-objectives { font-size: 15px; }\n  .o-objectives small { font: 500 13px/1 var(--o-font-mono); color: var(--o-text-dim); font-variant-numeric: tabular-nums; }\n\n  /* ---- 底部按键提示条 ---- */\n  .bar { position: relative; padding: 0 clamp(20px, 4vw, 56px) 24px; }\n  .bar .o-rule { margin: 0 5px 18px; }\n  .bar-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; }\n  .actions { display: flex; flex-wrap: wrap; gap: 12px; }\n  .o-btn { min-height: 44px; }\n  .where { color: var(--o-text-dim); font: 500 13px/1.4 var(--o-font-mono); font-variant-numeric: tabular-nums; }\n\n  @media (pointer: coarse), (max-width: 760px) { .o-key { display: none; } }\n  @media (max-width: 960px) {\n    .planet { width: 120vw; right: -50vw; top: 0; transform: none; opacity: .55; }\n    .callouts, .tag { display: none; }\n    .main { padding-top: 24px; padding-bottom: 32px; }\n  }\n  @media (max-width: 760px) {\n    .top .o-tabs { display: none; }\n    .status { grid-template-columns: 1fr; justify-items: start; }\n    .o-arc { --size: 172px; }\n    .arc-read b { font-size: 26px; }\n  }\n<\/style>\n<\/head>\n<body>\n<div class=\"page\">\n  <div class=\"world\" aria-hidden=\"true\">\n    <div class=\"planet\">\n      <\!-- 引线在星球自己的坐标里画（0–100），对象上的空心圆 → 斜线 → 折成水平线 → 标注牌 -->\n      <svg class=\"callouts\" viewBox=\"0 0 100 100\" overflow=\"visible\">\n        <defs><mask id=\"behind\" maskUnits=\"userSpaceOnUse\" x=\"-100\" y=\"-100\" width=\"300\" height=\"300\">\n          <rect x=\"-100\" y=\"-100\" width=\"300\" height=\"300\" fill=\"#fff\"/><circle cx=\"50\" cy=\"50\" r=\"50\" fill=\"#000\"/>\n        <\/mask><\/defs>\n        <g fill=\"none\" vector-effect=\"non-scaling-stroke\">\n          <\!-- 轨道后半圈被星球挡住，前半圈压在星球上；亮段只有一处 -->\n          <path d=\"M -22 50 A 72 20 0 0 1 122 50\" stroke=\"rgba(236,234,226,.35)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\" transform=\"rotate(-14 50 50)\" mask=\"url(#behind)\"/>\n          <path d=\"M -22 50 A 72 20 0 0 0 122 50\" stroke=\"rgba(236,234,226,.4)\" stroke-width=\"1\" vector-effect=\"non-scaling-stroke\" transform=\"rotate(-14 50 50)\"/>\n          <path d=\"M -22 50 A 72 20 0 0 0 122 50\" stroke=\"rgba(236,234,226,.95)\" stroke-width=\".3\" stroke-linecap=\"round\" transform=\"rotate(-14 50 50)\" pathLength=\"100\" stroke-dasharray=\"12 200\" class=\"glint\"/>\n          <polyline class=\"o-draw\" pathLength=\"1\" style=\"--d:.5s;--t:.9s\" points=\"-19.86,67.42 -19.86,80 12,80\" stroke=\"rgba(236,234,226,.75)\" stroke-width=\".16\"/>\n          <polyline class=\"o-draw\" pathLength=\"1\" style=\"--d:.8s;--t:.9s\" points=\"58,26 58,12 46,12\" stroke=\"rgba(236,234,226,.75)\" stroke-width=\".16\"/>\n        <\/g>\n        <\!-- 锚点画在线之后、实心填充：线从圆心出发，被圆盖住，任何尺寸下都对齐 -->\n        <g fill=\"#0b0d10\" stroke=\"rgba(236,234,226,.9)\" stroke-width=\"1.2\">\n          <circle cx=\"-19.86\" cy=\"67.42\" r=\".8\" vector-effect=\"non-scaling-stroke\"/>\n          <circle cx=\"58\" cy=\"26\" r=\".8\" vector-effect=\"non-scaling-stroke\"/>\n        <\/g>\n      <\/svg>\n      <div class=\"tag\" style=\"left:12%;top:80%;animation-delay:1.3s\"><b>目标轨道 · 550 km<\/b><span>太阳同步 · 倾角 97.6°<\/span><\/div>\n      <div class=\"tag\" style=\"right:54%;top:12%;animation-delay:1.6s\"><b>晨昏线<\/b><span>卫星将一直沿它飞行<\/span><\/div>\n    <\/div>\n  <\/div>\n\n  <header class=\"top\">\n    <div class=\"brand\">\n      <span class=\"o-stripe\" style=\"--w:56px;--h:4px\" aria-hidden=\"true\"><\/span>\n      <b>星砚航天<\/b>\n      <span>XY-07 雁阵<\/span>\n    <\/div>\n    <div class=\"o-tabs\" role=\"tablist\" aria-label=\"任务页面\">\n      <button role=\"tab\" aria-selected=\"true\">概览<\/button>\n      <button role=\"tab\" aria-selected=\"false\">载荷<\/button>\n      <button role=\"tab\" aria-selected=\"false\">轨道<\/button>\n      <button role=\"tab\" aria-selected=\"false\">往期发射<\/button>\n    <\/div>\n  <\/header>\n\n  <main class=\"main o-stagger\">\n    <h1>十二颗星，<br><span class=\"nb\">送往晨昏线<\/span><\/h1>\n    <p class=\"lede\">10 月 18 日 02:14 UTC，XY-07 雁阵把 12 颗遥感卫星送进 550 公里的太阳同步轨道。直播从 T−30 分钟开始。<\/p>\n\n    <div class=\"status\">\n      <div class=\"o-arc\" role=\"img\" aria-label=\"距点火 1 小时 42 分 17 秒，准备进度 72%\">\n        <div class=\"arc-read\">\n          <span class=\"o-label\">距点火<\/span>\n          <b id=\"t\">01:42:17<\/b>\n        <\/div>\n      <\/div>\n      <section class=\"o-panel\" aria-labelledby=\"obj\">\n        <h2 id=\"obj\"><span>发射前检查<\/span><span>3 / 5<\/span><\/h2>\n        <ul class=\"o-objectives\">\n          <li data-state=\"done\" style=\"--i:0\">靶场安全确认<small>23:58<\/small><\/li>\n          <li data-state=\"done\" style=\"--i:1\">高空风评估通过<small>00:12<\/small><\/li>\n          <li data-state=\"done\" style=\"--i:2\">测控链路建立<small>238 ms<\/small><\/li>\n          <li data-state=\"active\">一级液氧补加<small>94.2%<\/small><\/li>\n          <li>最终放行投票<small>T−00:15<\/small><\/li>\n        <\/ul>\n      <\/section>\n    <\/div>\n  <\/main>\n\n  <footer class=\"bar\">\n    <div class=\"o-rule\"><\/div>\n    <div class=\"bar-row\">\n      <div class=\"actions\">\n        <a class=\"o-btn o-btn--primary\" href=\"#live\" data-key=\"Enter\"><span class=\"o-key\">Enter<\/span>观看直播<\/a>\n        <a class=\"o-btn\" href=\"#remind\" data-key=\"r\"><span class=\"o-key\">R<\/span>发射前 10 分钟提醒我<\/a>\n      <\/div>\n      <span class=\"where\">酒泉 · 9A 工位 · UTC 00:31:43<\/span>\n    <\/div>\n  <\/footer>\n<\/div>\n<script>\n  // 按键提示是真的：键盘能触发，和点击走同一个入口\n  addEventListener(\"keydown\", e => {\n    if (e.target.closest(\"input, textarea, [contenteditable]\")) return;\n    const el = document.querySelector(`[data-key=\"${e.key === \"Enter\" ? \"Enter\" : e.key.toLowerCase()}\"]`);\n    if (el) { e.preventDefault(); el.focus(); el.click(); }\n  });\n  let s = 1 * 3600 + 42 * 60 + 17;\n  const t = document.getElementById(\"t\"), p = n => String(n).padStart(2, \"0\");\n  setInterval(() => { s = Math.max(0, s - 1); t.textContent = `${p(s / 3600 | 0)}:${p((s / 60 | 0) % 60)}:${p(s % 60)}`; }, 1000);\n<\/script>\n<\/body>\n<\/html>\n"}]};
const MOBILE = { width: 390, height: 844 };
const state = { view: "grid", device: "desktop", index: 0 };
const list = document.getElementById("list");

document.getElementById("title").textContent = `${DATA.project} · 第 ${DATA.round} 轮`;
document.getElementById("brief").textContent = DATA.brief;
document.title = `${DATA.project} · 第 ${DATA.round} 轮方向对比`;

const label = (c, i) => c.baseline ? "现状" : String(DATA.candidates.filter(x => !x.baseline).indexOf(c) + 1).padStart(2, "0");

const cards = DATA.candidates.map((c, i) => {
  const card = document.createElement("article");
  card.className = "card";
  const stage = document.createElement("div");
  stage.className = "stage";
  let frame;
  if (c.image) {
    frame = document.createElement("img");
    frame.src = c.image;
    frame.alt = c.name;
  } else {
    frame = document.createElement("iframe");
    frame.title = c.name;
    frame.setAttribute("sandbox", "allow-scripts");
    frame.loading = "lazy";
    frame.srcdoc = c.html;
  }
  stage.appendChild(frame);
  card.appendChild(stage);

  const meta = document.createElement("div");
  meta.className = "meta";
  meta.innerHTML = `
    <div class="title"><span class="num"></span><h2 class="name"></h2></div>
    <p class="concept"></p><p class="typo"></p>
    <div class="swatches"></div><ul class="traits"></ul>
    <div class="actions"><button class="open">单张查看</button><button class="pick">选择</button></div>`;
  meta.querySelector(".num").textContent = label(c, i);
  meta.querySelector(".name").textContent = c.name;
  meta.querySelector(".concept").textContent = c.concept;
  meta.querySelector(".typo").textContent = c.typography;
  for (const hex of c.palette) {
    const s = document.createElement("span");
    s.style.background = hex; s.title = hex;
    meta.querySelector(".swatches").appendChild(s);
  }
  for (const t of c.traits) {
    const li = document.createElement("li"); li.textContent = t;
    meta.querySelector(".traits").appendChild(li);
  }
  meta.querySelector(".open").onclick = () => { state.index = i; setView("single"); };
  meta.querySelector(".pick").onclick = () => pick(c, i);
  card.appendChild(meta);
  list.appendChild(card);
  return { card, stage, frame, c };
});

function viewportOf(c) {
  if (c.viewport) return c.viewport;
  return state.device === "mobile" ? MOBILE : DATA.defaultViewport;
}

function layout() {
  for (const { stage, frame, c, card } of cards) {
    if (card.hidden) continue;
    const vp = viewportOf(c);
    let w = stage.clientWidth;
    let scale = w / vp.width;
    if (state.device === "mobile" && !c.viewport) {
      // 手机视口：按高度限制，居中摆放
      const maxH = state.view === "single" ? Math.min(window.innerHeight - 120, vp.height) : 560;
      scale = Math.min(1, maxH / vp.height, w / vp.width);
    }
    frame.style.width = vp.width + "px";
    frame.style.height = vp.height + "px";
    frame.style.transform = `scale(${scale})`;
    frame.style.left = Math.max(0, (w - vp.width * scale) / 2) + "px";
    stage.style.height = vp.height * scale + "px";
  }
}

function setView(v) {
  state.view = v;
  list.classList.toggle("single", v === "single");
  cards.forEach((x, i) => x.card.hidden = v === "single" && i !== state.index);
  press("view", v);
  layout();
}
function setDevice(d) { state.device = d; press("device", d); layout(); }
function press(attr, val) {
  document.querySelectorAll(`[data-${attr}]`).forEach(b => b.setAttribute("aria-pressed", String(b.dataset[attr] === val)));
}
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => setView(b.dataset.view));
document.querySelectorAll("[data-device]").forEach(b => b.onclick = () => setDevice(b.dataset.device));

document.addEventListener("keydown", e => {
  if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
  const n = cards.length;
  state.index = (state.index + (e.key === "ArrowRight" ? 1 : n - 1)) % n;
  setView("single");
});

async function pick(c, i) {
  const text = `第 ${DATA.round} 轮：选 ${label(c, i)} ${c.name}`;
  try { await navigator.clipboard.writeText(text); toast(`已复制：“${text}”，发给 Agent 继续`); }
  catch { toast(`请手动复制：${text}`); }
}
let timer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(timer); timer = setTimeout(() => t.classList.remove("show"), 3200);
}

new ResizeObserver(layout).observe(list);
layout();
</script>
</body>
