<!doctype html>
<html lang="zh-CN" data-orbit="frontier">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>案例 · Orbit UI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600&family=JetBrains+Mono:wght@400&display=swap">
<link rel="stylesheet" href="site/orbit.css">
<link rel="stylesheet" href="site/site.css">
<script>document.documentElement.classList.add("js")</script>
<style>
  .head { padding-block: clamp(48px, 7vw, 88px) 32px; display: grid; gap: 16px; }
  .head h1 { font: 300 clamp(38px, 5vw, 64px)/1.15 var(--o-font-display); margin: 0; }
  .bar { position: sticky; top: 64px; z-index: 10; background: rgba(11,13,16,.88); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--o-line); padding: 14px 0; }
  .bar .container { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
  .count { color: var(--o-text-dim); font: 500 14px/1 var(--o-font-mono); }
  .grid { display: grid; gap: 28px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); padding: 32px 0 80px; }
  .card { display: flex; flex-direction: column; border: 1px solid var(--o-line); border-radius: 3px; background: var(--o-surface); overflow: hidden; }
  .card[hidden] { display: none; }
  .card .preview { border-bottom: 1px solid var(--o-line); }
  .meta { padding: 18px 20px 20px; display: grid; gap: 10px; flex: 1; align-content: start; }
  .meta h2 { margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 500 19px/1.3 var(--o-font-body); }
  .chip { font: 500 12px/1 var(--o-font-mono); color: var(--o-text-dim); border: 1px solid var(--o-line); padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
  .meta p { margin: 0; color: var(--o-text-dim); font-size: 15px; }
  .map { list-style: none; margin: 4px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
  .map li { display: grid; grid-template-columns: 7em 1fr; gap: 10px; }
  .map li span:first-child { color: var(--o-text-dim); }
  .links { display: flex; gap: 10px; margin-top: auto; padding-top: 8px; flex-wrap: wrap; }
  .links .o-btn { min-height: 38px; font-size: 14px; }
  .explorer { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 32px; align-items: center; }
  .explorer .preview { border: 1px solid var(--o-line); border-radius: 3px; }
  @media (max-width: 860px) { .explorer { grid-template-columns: 1fr; } }
  @media (max-width: 640px) { .bar { top: 0; position: relative; } }
</style>
</head>
<body>
<header class="nav">
  <div class="container">
    <a class="logo" href="index.html"><span class="o-stripe" style="--w:28px;--h:4px" aria-hidden="true"></span><b>Orbit UI</b></a>
    <nav class="nav-links" aria-label="主导航">
      <a href="index.html">介绍</a>
      <a href="showcase.html" aria-current="page">案例</a>
      <a href="docs.html">使用指南</a>
    </nav>
  </div>
</header>

<div class="container head">
  <div class="kicker">案例</div>
  <h1>11 个可以直接打开的页面</h1>
  <p class="lead">四个方向的发射页、六个日常业务界面和一页控件总览。都是真实运行的 HTML，预览框里看到的就是页面本身。</p>
</div>

<div class="bar">
  <div class="container">
    <div class="o-tabs" data-group="filter" role="tablist" aria-label="筛选">
      <button role="tab" data-value="all" aria-selected="true">全部</button>
      <button role="tab" data-value="space" aria-selected="false">太空发射页</button>
      <button role="tab" data-value="biz" aria-selected="false">日常业务</button>
      <button role="tab" data-value="kit" aria-selected="false">控件</button>
    </div>
    <span class="count" id="count"></span>
    <div class="o-tabs" data-group="device" role="tablist" aria-label="预览尺寸">
      <button role="tab" data-value="desktop" aria-selected="true">桌面</button>
      <button role="tab" data-value="mobile" aria-selected="false">手机</button>
    </div>
  </div>
</div>

<main class="container">
  <div class="grid" id="grid"></div>

  <section class="section">
    <div class="explorer">
      <div>
        <div class="kicker">风格对比页</div>
        <h2 class="h2">Agent 交给你挑的<span class="nb">就是这一页</span></h2>
        <p class="lead">并排或单张查看，切换桌面和手机，←→ 翻页。点“选择”会复制一句“第 01 轮：选 04 星际拓荒”，发回给 Agent 就能接着做。</p>
        <p style="margin-top:24px"><a class="o-btn o-btn--primary" href="examples/launch-page/style-explorer.html">打开对比页 ↗</a></p>
      </div>
      <div class="preview" data-src="examples/launch-page/style-explorer.html" data-viewport="1440x900"></div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <span>Orbit UI · MIT 许可 · 案例中的公司、人名与数据均为虚构</span>
    <nav><a href="index.html">介绍</a><a href="showcase.html">案例</a><a href="docs.html">使用指南</a></nav>
  </div>
</footer>

<script>
  const CASES = [
    { cat: "space", file: "launch-page/frontier.html", name: "发射页 · 星际拓荒", dir: "frontier", desc: "参考 Starfield 的 NASA-punk：星球、引线标注、任务清单和按键提示。", map: [["主角", "被标注的星球"], ["记忆点", "刻度环倒计时"], ["控件", "选中反白 · [Enter] 按键"]] },
    { cat: "space", file: "launch-page/mission.html", name: "发射页 · 任务控制台", dir: "mission", desc: "1970 年代控制室：琥珀色的超大倒计时，三栏遥测。", map: [["主角", "T−01:42:17"], ["记忆点", "检查清单状态灯"], ["装饰", "坐标网格"]] },
    { cat: "space", file: "launch-page/blueprint.html", name: "发射页 · 轨道蓝图", dir: "blueprint", desc: "工程图纸：读懂 12 颗卫星分三批去了哪里。", map: [["主角", "SVG 轨道图"], ["记忆点", "沿轨道移动的卫星"], ["装饰", "图纸标题栏"]] },
    { cat: "space", file: "launch-page/deepfield.html", name: "发射页 · 深空", dir: "deepfield", desc: "安静到只剩一道晨光，大留白和大气光晕。", map: [["主角", "行星边缘"], ["记忆点", "唯一的发光是大气层"], ["装饰", "视差星点"]] },
    { cat: "biz", file: "scenarios/delivery.html", name: "外卖订单追踪", dir: "frontier", desc: "用户只关心还要多久、骑手在哪。", map: [["配送路线", "轨道"], ["骑手", "卫星"], ["送达时间", "刻度环倒计时"]] },
    { cat: "biz", file: "scenarios/smart-home.html", name: "智能家居", dir: "frontier", desc: "21 台设备，一眼看到哪个房间不对劲。", map: [["房间", "舱段（反白选中）"], ["设备", "开关"], ["异常", "状态灯"]] },
    { cat: "biz", file: "scenarios/wallet.html", name: "个人账户", dir: "deepfield", desc: "余额是唯一亮着的东西，交易记录退到暗处。", map: [["余额", "主读数"], ["预算", "刻度环"], ["分类", "刻度条"]] },
    { cat: "biz", file: "scenarios/product.html", name: "电商商品详情", dir: "blueprint", desc: "卖点不写口号，标在耳机的线稿上。", map: [["商品", "工程图纸"], ["卖点", "引线标注"], ["尺寸", "尺寸线"]] },
    { cat: "biz", file: "scenarios/fitness.html", name: "跑步记录", dir: "mission", desc: "一次晨跑就是一次飞行数据回放。", map: [["距离", "主读数"], ["路线", "轨迹"], ["分段", "遥测表"]] },
    { cat: "biz", file: "scenarios/admin.html", name: "门店运营看板", dir: "mission", desc: "42 家店里出问题的那几家，自己浮上来。", map: [["门店", "舰队"], ["营业额", "主读数"], ["告警", "状态灯三重表达"]] },
    { cat: "kit", file: "components.html", name: "控件总览", dir: "四套色板", desc: "按钮、输入、状态灯、刻度环、菜单、开关……切换色板看语法是否成立。", map: [["色板", "mission / blueprint / deepfield / frontier"], ["用法", "复制 orbit.css 即可"]] },
  ];
  const DIR_NAME = { frontier: "星际拓荒", mission: "任务控制台", blueprint: "轨道蓝图", deepfield: "深空" };
  const VIEW = { desktop: ["1280x800", ""], mobile: ["390x844", "460"] };
  const grid = document.getElementById("grid");

  CASES.forEach(c => {
    const card = document.createElement("article");
    card.className = "card";
    card.dataset.cat = c.cat;
    card.innerHTML = `<div class="preview"></div>
      <div class="meta"><h2><span></span><span class="chip"></span></h2><p></p><ul class="map"></ul>
      <div class="links"><a class="o-btn" target="_blank" rel="noopener">打开页面 ↗</a></div></div>`;
    const src = "examples/" + c.file;
    card.querySelector(".preview").dataset.src = src;
    card.querySelector("h2 span").textContent = c.name;
    card.querySelector(".chip").textContent = DIR_NAME[c.dir] || c.dir;
    card.querySelector("p").textContent = c.desc;
    c.map.forEach(([k, v]) => {
      const li = document.createElement("li");
      li.innerHTML = "<span></span><span></span>";
      li.children[0].textContent = k; li.children[1].textContent = v;
      card.querySelector(".map").appendChild(li);
    });
    card.querySelector("a").href = src;
    grid.appendChild(card);
  });

  function setDevice(d) {
    document.querySelectorAll("#grid .preview").forEach(p => { p.dataset.viewport = VIEW[d][0]; p.dataset.height = VIEW[d][1]; });
    if (window.layoutPreviews) layoutPreviews();
  }
  function setFilter(f) {
    let n = 0;
    document.querySelectorAll("#grid .card").forEach(card => { const show = f === "all" || card.dataset.cat === f; card.hidden = !show; n += show; });
    document.getElementById("count").textContent = `${n} 个页面`;
    if (window.layoutPreviews) layoutPreviews();
  }
  setDevice("desktop");
  setFilter("all");
  document.addEventListener("tab:device", e => setDevice(e.detail));
  document.addEventListener("tab:filter", e => setFilter(e.detail));
</script>
<script src="site/site.js"></script>
</body>
</html>
